            application/json:
              schema:
                $ref: '#/components/schemas/UnsupportedRegionException'
              examples:
                DescribeGameSessionDetails485Example:
                  summary: Default DescribeGameSessionDetails 485 response
                  x-microcks-default: true
                  value: example-value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescribeGameSessionDetailsInput'
      parameters:
