              examples:
                DescribeGameSessionDetails480Example:
                  summary: Default DescribeGameSessionDetails 480 response
                  x-microcks-default: true
                  value: example-value
        '481':
          description: NotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundException'
              examples:
                DescribeGameSessionDetails481Example:
                  summary: Default DescribeGameSessionDetails 481 response
                  x-microcks-default: true
                  value: example-value
        '482':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
              examples:
                DescribeGameSessionDetails482Example:
                  summary: Default DescribeGameSessionDetails 482 response
                  x-microcks-default: true
                  value: example-value
        '483':
          description: UnauthorizedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedException'
              examples:
                DescribeGameSessionDetails483Example:
                  summary: Default DescribeGameSessionDetails 483 response
                  x-microcks-default: true
                  value: example-value
        '484':
          description: TerminalRoutingStrategyException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalRoutingStrategyException'
              examples:
                DescribeGameSessionDetails484Example:
                  summary: Default DescribeGameSessionDetails 484 response
