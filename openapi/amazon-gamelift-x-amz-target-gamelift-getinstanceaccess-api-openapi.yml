security:
- hmac: []
tags:
- name: '#X Amz Target=GameLift.GetInstanceAccess'
paths:
  /#X-Amz-Target=GameLift.GetInstanceAccess:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: GetInstanceAccess
      description: 'Requests remote access to a fleet instance. Remote access is useful for debugging, gathering benchmarking data, or observing activity in real time.


        To remotely access an instance, you need credentials that match the operating system of the instance. For a Windows instance, Amazon GameLift returns a user name and password as strings for use with a Windows Remote Desktop client. For a Linux instance, Amazon GameLift returns a user name and RSA private key, also as strings, for use with an SSH client. The private key must be saved in the proper format to a .pem file before using. If you''re making this request using the CLI, saving the secret can be handled as part of the GetInstanceAccess request, as shown in one of the examples for this operation.


        To request access to a specific instance, specify the IDs of both the instance and the fleet it belongs to. You can retrieve a fleet''s instance IDs by calling DescribeInstances.


        Learn more


        Remotely Access Fleet Instances


        Debug Fleet Issues


        Related actions


        All APIs by task'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInstanceAccessOutput'
              examples:
                GetInstanceAccess200Example:
                  summary: Default GetInstanceAccess 200 response
                  x-microcks-default: true
                  value:
                    InstanceAccess: example-value
        '480':
          description: UnauthorizedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedException'
              examples:
                GetInstanceAccess480Example:
                  summary: Default GetInstanceAccess 480 response
                  x-microcks-default: true
                  value: example-value
        '481':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
              examples:
                GetInstanceAccess481Example:
                  summary: Default GetInstanceAccess 481 response
                  x-microcks-default: true
                  value: example-value
        '482':
          description: NotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundException'
              examples:
                GetInstanceAccess482Example:
                  summary: Default GetInstanceAccess 482 response
                  x-microcks-default: true
                  value: example-value
        '483':
          description: InternalServiceException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServiceException'
              examples:
                GetInstanceAccess483Example:
                  summary: Default GetInstanceAccess 483 response
                  x-microcks-default: true
                  value: example-value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetInstanceAccessInput'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - GameLift.GetInstanceAccess
      summary: Amazon GameLift Get Instance Access
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=GameLift.GetInstanceAccess'
components:
  schemas:
    InvalidRequestException: {}
    NonEmptyString:
      type: string
      minLength: 1
    FleetId:
      type: string
      pattern: ^fleet-\S+
    InstanceAccess:
      type: object
      properties:
        FleetId:
          allOf:
          - $ref: '#/components/schemas/FleetId'
          - description: A unique identifier for the fleet containing the instance being accessed.
        InstanceId:
          allOf:
          - $ref: '#/components/schemas/InstanceId'
          - description: A unique identifier for the instance being accessed.
        IpAddress:
          allOf:
          - $ref: '#/components/schemas/IpAddress'
          - description: IP address that is assigned to the instance.
        OperatingSystem:
          allOf:
          - $ref: '#/components/schemas/OperatingSystem'
          - description: Operating system that is running on the instance.
        Credentials:
          allOf:
          - $ref: '#/components/schemas/InstanceCredentials'
          - description: Credentials required to access the instance.
      description: 'Information required to remotely connect to a fleet instance. '
    NotFoundException: {}
    GetInstanceAccessOutput:
      type: object
      properties:
        InstanceAccess:
          allOf:
          - $ref: '#/components/schemas/InstanceAccess'
          - description: The connection information for a fleet instance, including IP address and access credentials.
    FleetIdOrArn:
      type: string
      pattern: ^fleet-\S+|^arn:.*:fleet\/fleet-\S+
    InternalServiceException: {}
    IpAddress:
      type: string
      pattern: ^[0-9A-Fa-f\:\.]+
      minLength: 1
      maxLength: 128
    InstanceCredentials:
      type: object
      properties:
        UserName:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          - description: User login string.
        Secret:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          - description: Secret string. For Windows instances, the secret is a password for use with Windows Remote Desktop. For Linux instances, it is a private key (which must be saved as a <code>.pem</code> file) for use with SSH.
      description: Set of credentials required to remotely access a fleet instance.
    InstanceId:
      type: string
      pattern: '[a-zA-Z0-9\.-]+'
    UnauthorizedException: {}
    GetInstanceAccessInput:
      type: object
      required:
      - FleetId
      - InstanceId
      title: GetInstanceAccessInput
      properties:
        FleetId:
          allOf:
          - $ref: '#/components/schemas/FleetIdOrArn'
          - description: 'A unique identifier for the fleet that contains the instance you want access to. You can use either the fleet ID or ARN value. The fleet can be in any of the following statuses: <code>ACTIVATING</code>, <code>ACTIVE</code>, or <code>ERROR</code>. Fleets with an <code>ERROR</code> status may be accessible for a short time before they are deleted.'
        InstanceId:
          allOf:
          - $ref: '#/components/schemas/InstanceId'
          - description: A unique identifier for the instance you want to get access to. You can access an instance in any status.
    OperatingSystem:
      type: string
      enum:
      - WINDOWS_2012
      - AMAZON_LINUX
      - AMAZON_LINUX_2
      - WINDOWS_2016
  parameters:
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
