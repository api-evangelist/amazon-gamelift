components:
  schemas:
    ComputeArn:
      type: string
      pattern: ^arn:.*:compute\/[a-zA-Z0-9\-]+
      maxLength: 1024
    InvalidRequestException: {}
    NonEmptyString:
      type: string
      minLength: 1
    NotFoundException: {}
    FleetIdOrArn:
      type: string
      pattern: ^fleet-\S+|^arn:.*:fleet\/fleet-\S+
    ComputeNameOrArn:
      type: string
      pattern: '[a-zA-Z0-9\-]+|^arn:.*:compute\/[a-zA-Z0-9\-]+'
      maxLength: 1024
    InternalServiceException: {}
    GetComputeAccessOutput:
      type: object
      properties:
        FleetId:
          allOf:
          - $ref: '#/components/schemas/FleetIdOrArn'
          - description: The fleet ID of compute resource.
        FleetArn:
          allOf:
          - $ref: '#/components/schemas/FleetArn'
          - description: The Amazon Resource Name (<a href="https://docs.aws.amazon.com/AmazonS3/latest/dev/s3-arn-format.html">ARN</a>) that is assigned to a Amazon GameLift fleet resource and uniquely identifies it. ARNs are unique across all Regions. Format is <code>arn:aws:gamelift:&lt;region&gt;::fleet/fleet-a1234567-b8c9-0d1e-2fa3-b45c6d7e8912</code>.
        ComputeName:
          allOf:
          - $ref: '#/components/schemas/ComputeNameOrArn'
          - description: The name of the compute resource you requested credentials for.
        ComputeArn:
          allOf:
          - $ref: '#/components/schemas/ComputeArn'
          - description: The Amazon Resource Name (<a href="https://docs.aws.amazon.com/AmazonS3/latest/dev/s3-arn-format.html">ARN</a>) that is assigned to a Amazon GameLift compute resource and uniquely identifies it. ARNs are unique across all Regions. Format is <code>arn:aws:gamelift:&lt;region&gt;::compute/compute-a1234567-b8c9-0d1e-2fa3-b45c6d7e8912</code>.
        Credentials:
          allOf:
          - $ref: '#/components/schemas/AwsCredentials'
          - description: The access credentials for the compute resource.
    FleetArn:
      type: string
      pattern: ^arn:.*:fleet\/fleet-\S+
    AwsCredentials:
      type: object
      properties:
        AccessKeyId:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          - description: Temporary key allowing access to the Amazon GameLift S3 account.
        SecretAccessKey:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          - description: Temporary secret key allowing access to the Amazon GameLift S3 account.
        SessionToken:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          - description: Token used to associate a specific build ID with the files uploaded using these credentials.
      description: Temporary access credentials used for uploading game build files to Amazon GameLift. They are valid for a limited time. If they expire before you upload your game build, get a new set by calling <a href="https://docs.aws.amazon.com/gamelift/latest/apireference/API_RequestUploadCredentials.html">RequestUploadCredentials</a>.
    UnauthorizedException: {}
    GetComputeAccessInput:
      type: object
      required:
      - FleetId
      - ComputeName
      title: GetComputeAccessInput
      properties:
        FleetId:
          allOf:
          - $ref: '#/components/schemas/FleetIdOrArn'
          - description: A unique identifier for the fleet that the compute resource is registered to.
        ComputeName:
          allOf:
          - $ref: '#/components/schemas/ComputeNameOrArn'
          - description: The name of the compute resource you are requesting credentials for.
  parameters:
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
