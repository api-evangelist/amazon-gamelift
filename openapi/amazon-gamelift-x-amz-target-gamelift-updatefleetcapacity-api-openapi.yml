            application/json:
              schema:
                $ref: '#/components/schemas/InvalidFleetStatusException'
              examples:
                UpdateFleetCapacity483Example:
                  summary: Default UpdateFleetCapacity 483 response
                  x-microcks-default: true
                  value: example-value
        '484':
          description: InternalServiceException
