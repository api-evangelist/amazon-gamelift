components:
  schemas:
    LocationStringModel:
      type: string
      pattern: ^[A-Za-z0-9\-]+
      minLength: 1
      maxLength: 64
    LimitExceededException: {}
    InvalidFleetStatusException: {}
    InvalidRequestException: {}
    ConflictException: {}
    FleetId:
      type: string
      pattern: ^fleet-\S+
    UnsupportedRegionException: {}
    UpdateFleetCapacityInput:
      type: object
      required:
      - FleetId
      title: UpdateFleetCapacityInput
      properties:
        FleetId:
          allOf:
          - $ref: '#/components/schemas/FleetIdOrArn'
          - description: A unique identifier for the fleet to update capacity settings for. You can use either the fleet ID or ARN value.
        DesiredInstances:
          allOf:
          - $ref: '#/components/schemas/WholeNumber'
          - description: The number of Amazon EC2 instances you want to maintain in the specified fleet location. This value must fall between the minimum and maximum size limits.
        MinSize:
          allOf:
          - $ref: '#/components/schemas/WholeNumber'
          - description: The minimum number of instances that are allowed in the specified fleet location. If this parameter is not set, the default is 0.
        MaxSize:
          allOf:
          - $ref: '#/components/schemas/WholeNumber'
          - description: The maximum number of instances that are allowed in the specified fleet location. If this parameter is not set, the default is 1.
        Location:
          allOf:
          - $ref: '#/components/schemas/LocationStringModel'
          - description: The name of a remote location to update fleet capacity settings for, in the form of an Amazon Web Services Region code such as <code>us-west-2</code>.
    NotFoundException: {}
    FleetIdOrArn:
      type: string
      pattern: ^fleet-\S+|^arn:.*:fleet\/fleet-\S+
    WholeNumber:
      type: integer
      minimum: 0
    InternalServiceException: {}
    FleetArn:
      type: string
      pattern: ^arn:.*:fleet\/fleet-\S+
    UpdateFleetCapacityOutput:
      type: object
      properties:
        FleetId:
          allOf:
          - $ref: '#/components/schemas/FleetId'
          - description: A unique identifier for the fleet that was updated.
        FleetArn:
          allOf:
          - $ref: '#/components/schemas/FleetArn'
          - description: 'The Amazon Resource Name (<a href="https://docs.aws.amazon.com/AmazonS3/latest/dev/s3-arn-format.html">ARN</a>) that is assigned to a Amazon GameLift fleet resource and uniquely identifies it. ARNs are unique across all Regions. Format is <code>arn:aws:gamelift:&lt;region&gt;::fleet/fleet-a1234567-b8c9-0d1e-2fa3-b45c6d7e8912</code>. '
        Location:
          allOf:
          - $ref: '#/components/schemas/LocationStringModel'
          - description: The remote location being updated, expressed as an Amazon Web Services Region code, such as <code>us-west-2</code>.
    UnauthorizedException: {}
