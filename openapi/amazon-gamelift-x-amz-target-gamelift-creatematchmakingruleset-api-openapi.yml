              examples:
                CreateMatchmakingRuleSet481Example:
                  summary: Default CreateMatchmakingRuleSet 481 response
                  x-microcks-default: true
                  value: example-value
        '482':
          description: InternalServiceException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServiceException'
              examples:
                CreateMatchmakingRuleSet482Example:
                  summary: Default CreateMatchmakingRuleSet 482 response
                  x-microcks-default: true
                  value: example-value
        '483':
