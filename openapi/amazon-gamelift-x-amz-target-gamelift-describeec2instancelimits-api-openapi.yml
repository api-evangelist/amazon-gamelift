              examples:
                DescribeEC2InstanceLimits483Example:
                  summary: Default DescribeEC2InstanceLimits 483 response
                  x-microcks-default: true
                  value: example-value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescribeEC2InstanceLimitsInput'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - GameLift.DescribeEC2InstanceLimits
      summary: Amazon GameLift Describe E C2 Instance Limits
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=GameLift.DescribeEC2InstanceLimits'
