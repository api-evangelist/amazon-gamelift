    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: DescribeVpcPeeringConnections
      description: 'Retrieves information on VPC peering connections. Use this operation to get peering information for all fleets or for one specific fleet ID.


        To retrieve connection information, call this operation from the Amazon Web Services account that is used to manage the Amazon GameLift fleets. Specify a fleet ID or leave the parameter empty to retrieve all connection records. If successful, the retrieved information includes both active and pending connections. Active connections identify the IpV4 CIDR block that the VPC uses to connect.


        Related actions


        All APIs by task'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescribeVpcPeeringConnectionsOutput'
              examples:
                DescribeVpcPeeringConnections200Example:
                  summary: Default DescribeVpcPeeringConnections 200 response
                  x-microcks-default: true
                  value:
                    VpcPeeringConnections: example-value
        '480':
          description: UnauthorizedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedException'
              examples:
                DescribeVpcPeeringConnections480Example:
                  summary: Default DescribeVpcPeeringConnections 480 response
                  x-microcks-default: true
                  value: example-value
        '481':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
              examples:
                DescribeVpcPeeringConnections481Example:
                  summary: Default DescribeVpcPeeringConnections 481 response
                  x-microcks-default: true
                  value: example-value
        '482':
          description: NotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundException'
              examples:
                DescribeVpcPeeringConnections482Example:
                  summary: Default DescribeVpcPeeringConnections 482 response
                  x-microcks-default: true
                  value: example-value
        '483':
          description: InternalServiceException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServiceException'
              examples:
                DescribeVpcPeeringConnections483Example:
                  summary: Default DescribeVpcPeeringConnections 483 response
                  x-microcks-default: true
                  value: example-value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescribeVpcPeeringConnectionsInput'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - GameLift.DescribeVpcPeeringConnections
      summary: Amazon GameLift Describe Vpc Peering Connections
