          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsupportedRegionException'
              examples:
                CreateMatchmakingConfiguration484Example:
                  summary: Default CreateMatchmakingConfiguration 484 response
                  x-microcks-default: true
                  value: example-value
        '485':
