components:
  schemas:
    SnsArnStringModel:
      type: string
      pattern: '[a-zA-Z0-9:_/-]*(.fifo)?'
      minLength: 0
      maxLength: 300
    NonZeroAndMaxString:
      type: string
      minLength: 1
      maxLength: 1024
    InternalServiceException: {}
    WholeNumber:
      type: integer
      minimum: 0
    BackfillMode:
      type: string
      enum:
      - AUTOMATIC
      - MANUAL
    MatchmakingConfigurationArn:
      type: string
      pattern: ^arn:.*:matchmakingconfiguration\/[a-zA-Z0-9-\.]*
      description: Data type used for Matchmaking Configuration ARN.
    QueueArnsList:
      type: array
      items:
        $ref: '#/components/schemas/ArnStringModel'
    MatchmakingRuleSetName:
      type: string
      pattern: '[a-zA-Z0-9-\.]*|^arn:.*:matchmakingruleset\/[a-zA-Z0-9-\.]*'
      minLength: 1
      maxLength: 256
    MatchmakingRequestTimeoutInteger:
      type: integer
      minimum: 1
      maximum: 43200
    GameProperty:
      type: object
      required:
      - Key
      - Value
      properties:
        Key:
          allOf:
          - $ref: '#/components/schemas/GamePropertyKey'
          - description: The game property identifier.
        Value:
          allOf:
          - $ref: '#/components/schemas/GamePropertyValue'
          - description: The game property value.
      description: Set of key-value pairs that contain information about a game session. When included in a game session request, these properties communicate details to be used when setting up the new game session. For example, a game property might specify a game mode, level, or map. Game properties are passed to the game server process when initiating a new game session. For more information, see the <a href="https://docs.aws.amazon.com/gamelift/latest/developerguide/gamelift-sdk-client-api.html#gamelift-sdk-client-api-create"> Amazon GameLift Developer Guide</a>.
    MatchmakingAcceptanceTimeoutInteger:
      type: integer
      minimum: 1
      maximum: 600
    GamePropertyKey:
      type: string
      maxLength: 32
    GamePropertyList:
      type: array
      items:
        $ref: '#/components/schemas/GameProperty'
      maxItems: 16
    FlexMatchMode:
      type: string
      enum:
      - STANDALONE
      - WITH_QUEUE
    GameSessionData:
      type: string
      minLength: 1
      maxLength: 4096
    MatchmakingRuleSetArn:
      type: string
      pattern: ^arn:.*:matchmakingruleset\/[a-zA-Z0-9-\.]*
      description: Data type used for Matchmaking RuleSet ARN.
    InvalidRequestException: {}
    NotFoundException: {}
    BooleanModel:
      type: boolean
    ArnStringModel:
      type: string
      pattern: '[a-zA-Z0-9:/-]+'
      minLength: 1
      maxLength: 256
    CreateMatchmakingConfigurationOutput:
      type: object
      properties:
        Configuration:
          allOf:
          - $ref: '#/components/schemas/MatchmakingConfiguration'
          - description: Object that describes the newly created matchmaking configuration.
    TaggingFailedException: {}
    LimitExceededException: {}
    Timestamp:
      type: string
      format: date-time
    TagKey:
      type: string
      minLength: 1
      maxLength: 128
    CreateMatchmakingConfigurationInput:
      type: object
      required:
      - Name
      - RequestTimeoutSeconds
      - AcceptanceRequired
      - RuleSetName
      title: CreateMatchmakingConfigurationInput
      properties:
        Name:
          allOf:
          - $ref: '#/components/schemas/MatchmakingIdStringModel'
          - description: A unique identifier for the matchmaking configuration. This name is used to identify the configuration associated with a matchmaking request or ticket.
        Description:
          allOf:
          - $ref: '#/components/schemas/NonZeroAndMaxString'
          - description: 'A human-readable description of the matchmaking configuration. '
        GameSessionQueueArns:
          allOf:
          - $ref: '#/components/schemas/QueueArnsList'
          - description: 'The Amazon Resource Name (<a href="https://docs.aws.amazon.com/AmazonS3/latest/dev/s3-arn-format.html">ARN</a>) that is assigned to a Amazon GameLift game session queue resource and uniquely identifies it. ARNs are unique across all Regions. Format is <code>arn:aws:gamelift:&lt;region&gt;::gamesessionqueue/&lt;queue name&gt;</code>. Queues can be located in any Region. Queues are used to start new Amazon GameLift-hosted game sessions for matches that are created with this matchmaking configuration. If <code>FlexMatchMode</code> is set to <code>STANDALONE</code>, do not set this parameter. '
        RequestTimeoutSeconds:
          allOf:
          - $ref: '#/components/schemas/MatchmakingRequestTimeoutInteger'
          - description: The maximum duration, in seconds, that a matchmaking ticket can remain in process before timing out. Requests that fail due to timing out can be resubmitted as needed.
        AcceptanceTimeoutSeconds:
          allOf:
          - $ref: '#/components/schemas/MatchmakingAcceptanceTimeoutInteger'
          - description: 'The length of time (in seconds) to wait for players to accept a proposed match, if acceptance is required. '
        AcceptanceRequired:
          allOf:
          - $ref: '#/components/schemas/BooleanModel'
          - description: 'A flag that determines whether a match that was created with this configuration must be accepted by the matched players. To require acceptance, set to <code>TRUE</code>. With this option enabled, matchmaking tickets use the status <code>REQUIRES_ACCEPTANCE</code> to indicate when a completed potential match is waiting for player acceptance. '
        RuleSetName:
          allOf:
          - $ref: '#/components/schemas/MatchmakingRuleSetName'
          - description: A unique identifier for the matchmaking rule set to use with this configuration. You can use either the rule set name or ARN value. A matchmaking configuration can only use rule sets that are defined in the same Region.
        NotificationTarget:
          allOf:
          - $ref: '#/components/schemas/SnsArnStringModel'
          - description: An SNS topic ARN that is set up to receive matchmaking notifications. See <a href="https://docs.aws.amazon.com/gamelift/latest/flexmatchguide/match-notification.html"> Setting up notifications for matchmaking</a> for more information.
        AdditionalPlayerCount:
          allOf:
          - $ref: '#/components/schemas/WholeNumber'
          - description: The number of player slots in a match to keep open for future players. For example, if the configuration's rule set specifies a match for a single 12-person team, and the additional player count is set to 2, only 10 players are selected for the match. This parameter is not used if <code>FlexMatchMode</code> is set to <code>STANDALONE</code>.
        CustomEventData:
          allOf:
          - $ref: '#/components/schemas/CustomEventData'
          - description: 'Information to be added to all events related to this matchmaking configuration. '
        GameProperties:
          allOf:
          - $ref: '#/components/schemas/GamePropertyList'
          - description: A set of custom properties for a game session, formatted as key:value pairs. These properties are passed to a game server process with a request to start a new game session (see <a href="https://docs.aws.amazon.com/gamelift/latest/developerguide/gamelift-sdk-server-api.html#gamelift-sdk-server-startsession">Start a Game Session</a>). This information is added to the new <code>GameSession</code> object that is created for a successful match. This parameter is not used if <code>FlexMatchMode</code> is set to <code>STANDALONE</code>.
        GameSessionData:
          allOf:
          - $ref: '#/components/schemas/GameSessionData'
          - description: A set of custom game session properties, formatted as a single string value. This data is passed to a game server process with a request to start a new game session (see <a href="https://docs.aws.amazon.com/gamelift/latest/developerguide/gamelift-sdk-server-api.html#gamelift-sdk-server-startsession">Start a Game Session</a>). This information is added to the new <code>GameSession</code> object that is created for a successful match. This parameter is not used if <code>FlexMatchMode</code> is set to <code>STANDALONE</code>.
        BackfillMode:
          allOf:
          - $ref: '#/components/schemas/BackfillMode'
          - description: The method used to backfill game sessions that are created with this matchmaking configuration. Specify <code>MANUAL</code> when your game manages backfill requests manually or does not use the match backfill feature. Specify <code>AUTOMATIC</code> to have Amazon GameLift create a backfill request whenever a game session has one or more open slots. Learn more about manual and automatic backfill in <a href="https://docs.aws.amazon.com/gamelift/latest/flexmatchguide/match-backfill.html"> Backfill Existing Games with FlexMatch</a>. Automatic backfill is not available when <code>FlexMatchMode</code> is set to <code>STANDALONE</code>.
        FlexMatchMode:
          allOf:
          - $ref: '#/components/schemas/FlexMatchMode'
          - description: <p>Indicates whether this matchmaking configuration is being used with Amazon GameLift hosting or as a standalone matchmaking solution. </p> <ul> <li> <p> <b>STANDALONE</b> - FlexMatch forms matches and returns match information, including players and team assignments, in a <a href="https://docs.aws.amazon.com/gamelift/latest/flexmatchguide/match-events.html#match-events-matchmakingsucceeded"> MatchmakingSucceeded</a> event.</p> </li> <li> <p> <b>WITH_QUEUE</b> - FlexMatch forms matches and uses the specified Amazon GameLift queue to start a game session for the match. </p> </li> </ul>
        Tags:
          allOf:
          - $ref: '#/components/schemas/TagList'
          - description: A list of labels to assign to the new matchmaking configuration resource. Tags are developer-defined key-value pairs. Tagging Amazon Web Services resources are useful for resource management, access management and cost allocation. For more information, see <a href="https://docs.aws.amazon.com/general/latest/gr/aws_tagging.html"> Tagging Amazon Web Services Resources</a> in the <i>Amazon Web Services General Reference</i>.
    CustomEventData:
      type: string
      minLength: 0
      maxLength: 256
    TagValue:
      type: string
      minLength: 0
      maxLength: 256
    MatchmakingIdStringModel:
      type: string
      pattern: '[a-zA-Z0-9-\.]*'
      maxLength: 128
    UnsupportedRegionException: {}
    MatchmakingConfiguration:
      type: object
      properties:
        Name:
          allOf:
          - $ref: '#/components/schemas/MatchmakingIdStringModel'
          - description: A unique identifier for the matchmaking configuration. This name is used to identify the configuration associated with a matchmaking request or ticket.
        ConfigurationArn:
          allOf:
          - $ref: '#/components/schemas/MatchmakingConfigurationArn'
          - description: The Amazon Resource Name (<a href="https://docs.aws.amazon.com/AmazonS3/latest/dev/s3-arn-format.html">ARN</a>) that is assigned to a Amazon GameLift matchmaking configuration resource and uniquely identifies it. ARNs are unique across all Regions. Format is <code>arn:aws:gamelift:&lt;region&gt;::matchmakingconfiguration/&lt;matchmaking configuration name&gt;</code>. In a Amazon GameLift configuration ARN, the resource ID matches the <i>Name</i> value.
        Description:
          allOf:
          - $ref: '#/components/schemas/NonZeroAndMaxString'
          - description: A descriptive label that is associated with matchmaking configuration.
        GameSessionQueueArns:
          allOf:
          - $ref: '#/components/schemas/QueueArnsList'
          - description: The Amazon Resource Name (<a href="https://docs.aws.amazon.com/AmazonS3/latest/dev/s3-arn-format.html">ARN</a>) that is assigned to a Amazon GameLift game session queue resource and uniquely identifies it. ARNs are unique across all Regions. Format is <code>arn:aws:gamelift:&lt;region&gt;::gamesessionqueue/&lt;queue name&gt;</code>. Queues can be located in any Region. Queues are used to start new Amazon GameLift-hosted game sessions for matches that are created with this matchmaking configuration. This property is not set when <code>FlexMatchMode</code> is set to <code>STANDALONE</code>.
        RequestTimeoutSeconds:
          allOf:
          - $ref: '#/components/schemas/MatchmakingRequestTimeoutInteger'
          - description: The maximum duration, in seconds, that a matchmaking ticket can remain in process before timing out. Requests that fail due to timing out can be resubmitted as needed.
        AcceptanceTimeoutSeconds:
          allOf:
          - $ref: '#/components/schemas/MatchmakingAcceptanceTimeoutInteger'
          - description: The length of time (in seconds) to wait for players to accept a proposed match, if acceptance is required. If any player rejects the match or fails to accept before the timeout, the ticket continues to look for an acceptable match.
        AcceptanceRequired:
          allOf:
          - $ref: '#/components/schemas/BooleanModel'
          - description: A flag that indicates whether a match that was created with this configuration must be accepted by the matched players. To require acceptance, set to TRUE. When this option is enabled, matchmaking tickets use the status <code>REQUIRES_ACCEPTANCE</code> to indicate when a completed potential match is waiting for player acceptance.
        RuleSetName:
          allOf:
          - $ref: '#/components/schemas/MatchmakingIdStringModel'
          - description: A unique identifier for the matchmaking rule set to use with this configuration. A matchmaking configuration can only use rule sets that are defined in the same Region.
        RuleSetArn:
          allOf:
          - $ref: '#/components/schemas/MatchmakingRuleSetArn'
          - description: The Amazon Resource Name (<a href="https://docs.aws.amazon.com/AmazonS3/latest/dev/s3-arn-format.html">ARN</a>) associated with the GameLift matchmaking rule set resource that this configuration uses.
        NotificationTarget:
          allOf:
          - $ref: '#/components/schemas/SnsArnStringModel'
          - description: An SNS topic ARN that is set up to receive matchmaking notifications.
        AdditionalPlayerCount:
          allOf:
          - $ref: '#/components/schemas/WholeNumber'
          - description: The number of player slots in a match to keep open for future players. For example, if the configuration's rule set specifies a match for a single 12-person team, and the additional player count is set to 2, only 10 players are selected for the match. This parameter is not used when <code>FlexMatchMode</code> is set to <code>STANDALONE</code>.
        CustomEventData:
          allOf:
          - $ref: '#/components/schemas/CustomEventData'
          - description: 'Information to attach to all events related to the matchmaking configuration. '
        CreationTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: A time stamp indicating when this data object was created. Format is a number expressed in Unix time as milliseconds (for example <code>"1469498468.057"</code>).
        GameProperties:
          allOf:
          - $ref: '#/components/schemas/GamePropertyList'
          - description: A set of custom properties for a game session, formatted as key:value pairs. These properties are passed to a game server process with a request to start a new game session (see <a href="https://docs.aws.amazon.com/gamelift/latest/developerguide/gamelift-sdk-server-api.html#gamelift-sdk-server-startsession">Start a Game Session</a>). This information is added to the new <code>GameSession</code> object that is created for a successful match. This parameter is not used when <code>FlexMatchMode</code> is set to <code>STANDALONE</code>.
        GameSessionData:
          allOf:
          - $ref: '#/components/schemas/GameSessionData'
          - description: A set of custom game session properties, formatted as a single string value. This data is passed to a game server process with a request to start a new game session (see <a href="https://docs.aws.amazon.com/gamelift/latest/developerguide/gamelift-sdk-server-api.html#gamelift-sdk-server-startsession">Start a Game Session</a>). This information is added to the new <code>GameSession</code> object that is created for a successful match. This parameter is not used when <code>FlexMatchMode</code> is set to <code>STANDALONE</code>.
        BackfillMode:
          allOf:
          - $ref: '#/components/schemas/BackfillMode'
          - description: The method used to backfill game sessions created with this matchmaking configuration. MANUAL indicates that the game makes backfill requests or does not use the match backfill feature. AUTOMATIC indicates that GameLift creates backfill requests whenever a game session has one or more open slots. Learn more about manual and automatic backfill in <a href="https://docs.aws.amazon.com/gamelift/latest/flexmatchguide/match-backfill.html">Backfill existing games with FlexMatch</a>. Automatic backfill is not available when <code>FlexMatchMode</code> is set to <code>STANDALONE</code>.
        FlexMatchMode:
          allOf:
          - $ref: '#/components/schemas/FlexMatchMode'
          - description: <p>Indicates whether this matchmaking configuration is being used with Amazon GameLift hosting or as a standalone matchmaking solution. </p> <ul> <li> <p> <b>STANDALONE</b> - FlexMatch forms matches and returns match information, including players and team assignments, in a <a href="https://docs.aws.amazon.com/gamelift/latest/flexmatchguide/match-events.html#match-events-matchmakingsucceeded"> MatchmakingSucceeded</a> event.</p> </li> <li> <p> <b>WITH_QUEUE</b> - FlexMatch forms matches and uses the specified Amazon GameLift queue to start a game session for the match. </p> </li> </ul>
