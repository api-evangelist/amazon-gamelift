    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: DescribeFleetLocationUtilization
      description: 'Retrieves current usage data for a fleet location. Utilization data provides a snapshot of current game hosting activity at the requested location. Use this operation to retrieve utilization information for a fleet''s remote location or home Region (you can also retrieve home Region utilization by calling DescribeFleetUtilization).


        To retrieve utilization data, identify a fleet and location.


        If successful, a FleetUtilization object is returned for the requested fleet location.


        Learn more


        Setting up Amazon GameLift fleets


        GameLift metrics for fleets'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescribeFleetLocationUtilizationOutput'
              examples:
                DescribeFleetLocationUtilization200Example:
                  summary: Default DescribeFleetLocationUtilization 200 response
                  x-microcks-default: true
                  value:
                    FleetUtilization: example-value
        '480':
          description: InternalServiceException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServiceException'
              examples:
                DescribeFleetLocationUtilization480Example:
                  summary: Default DescribeFleetLocationUtilization 480 response
                  x-microcks-default: true
                  value: example-value
        '481':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
              examples:
                DescribeFleetLocationUtilization481Example:
                  summary: Default DescribeFleetLocationUtilization 481 response
                  x-microcks-default: true
                  value: example-value
        '482':
          description: UnauthorizedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedException'
              examples:
                DescribeFleetLocationUtilization482Example:
                  summary: Default DescribeFleetLocationUtilization 482 response
                  x-microcks-default: true
                  value: example-value
        '483':
          description: NotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundException'
              examples:
                DescribeFleetLocationUtilization483Example:
                  summary: Default DescribeFleetLocationUtilization 483 response
                  x-microcks-default: true
                  value: example-value
        '484':
          description: UnsupportedRegionException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsupportedRegionException'
              examples:
                DescribeFleetLocationUtilization484Example:
                  summary: Default DescribeFleetLocationUtilization 484 response
                  x-microcks-default: true
                  value: example-value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescribeFleetLocationUtilizationInput'
      parameters:
