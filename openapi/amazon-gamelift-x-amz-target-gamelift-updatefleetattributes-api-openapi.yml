    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: UpdateFleetAttributes
      description: 'Updates a fleet''s mutable attributes, including game session protection and resource creation limits.


        To update fleet attributes, specify the fleet ID and the property values that you want to change.


        If successful, an updated FleetAttributes object is returned.


        Learn more


        Setting up Amazon GameLift fleets'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateFleetAttributesOutput'
              examples:
                UpdateFleetAttributes200Example:
                  summary: Default UpdateFleetAttributes 200 response
                  x-microcks-default: true
                  value:
                    FleetId: fleet-1a2b3c4d-5678-90ab-cdef-1234567890ab
                    FleetArn: arn:aws:gamelift:us-east-1:123456789012:fleet/fleet-1a2b3c4d
        '480':
          description: NotFoundException
