    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: UpdateBuild
      description: 'Updates metadata in a build resource, including the build name and version. To update the metadata, specify the build ID to update and provide the new values. If successful, a build object containing the updated metadata is returned.


        Learn more


        Upload a Custom Server Build


        All APIs by task'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateBuildOutput'
              examples:
                UpdateBuild200Example:
                  summary: Default UpdateBuild 200 response
                  x-microcks-default: true
                  value:
                    Build: example-value
        '480':
          description: UnauthorizedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedException'
              examples:
                UpdateBuild480Example:
                  summary: Default UpdateBuild 480 response
                  x-microcks-default: true
                  value: example-value
        '481':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
              examples:
                UpdateBuild481Example:
                  summary: Default UpdateBuild 481 response
                  x-microcks-default: true
                  value: example-value
        '482':
          description: NotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundException'
              examples:
                UpdateBuild482Example:
                  summary: Default UpdateBuild 482 response
                  x-microcks-default: true
                  value: example-value
        '483':
          description: InternalServiceException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServiceException'
              examples:
                UpdateBuild483Example:
                  summary: Default UpdateBuild 483 response
                  x-microcks-default: true
                  value: example-value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBuildInput'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - GameLift.UpdateBuild
      summary: Amazon GameLift Update Build
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=GameLift.UpdateBuild'
components:
  schemas:
    PositiveLong:
      type: integer
      minimum: 1
    ServerSdkVersion:
      type: string
      pattern: ^\d+\.\d+\.\d+$
      description: Data type used for server SDK version.
      maxLength: 128
    BuildIdOrArn:
      type: string
      pattern: ^build-\S+|^arn:.*:build\/build-\S+
    InvalidRequestException: {}
    BuildArn:
      type: string
      pattern: ^arn:.*:build\/build-\S+
    BuildStatus:
      type: string
      enum:
      - INITIALIZED
      - READY
      - FAILED
    Timestamp:
      type: string
      format: date-time
    BuildId:
      type: string
      pattern: ^build-\S+
    FreeText:
      type: string
    NotFoundException: {}
    NonZeroAndMaxString:
      type: string
      minLength: 1
      maxLength: 1024
    UpdateBuildOutput:
      type: object
      properties:
        Build:
          allOf:
          - $ref: '#/components/schemas/Build'
          - description: The updated build resource.
    Build:
      type: object
      properties:
        BuildId:
          allOf:
          - $ref: '#/components/schemas/BuildId'
          - description: A unique identifier for the build.
        BuildArn:
          allOf:
          - $ref: '#/components/schemas/BuildArn'
          - description: The Amazon Resource Name (<a href="https://docs.aws.amazon.com/AmazonS3/latest/dev/s3-arn-format.html">ARN</a>) assigned to a Amazon GameLift build resource and uniquely identifies it. ARNs are unique across all Regions. Format is <code>arn:aws:gamelift:&lt;region&gt;::build/build-a1234567-b8c9-0d1e-2fa3-b45c6d7e8912</code>. In a GameLift build ARN, the resource ID matches the <i>BuildId</i> value.
        Name:
          allOf:
          - $ref: '#/components/schemas/FreeText'
          - description: A descriptive label associated with a build. Build names don't need to be unique. It can be set using <a href="https://docs.aws.amazon.com/gamelift/latest/apireference/API_CreateBuild.html">CreateBuild</a> or <a href="https://docs.aws.amazon.com/gamelift/latest/apireference/UpdateBuild">UpdateBuild</a>.
        Version:
          allOf:
          - $ref: '#/components/schemas/FreeText'
          - description: Version information associated with a build or script. Version strings don't need to be unique.
        Status:
          allOf:
          - $ref: '#/components/schemas/BuildStatus'
          - description: <p>Current status of the build.</p> <p>Possible build statuses include the following:</p> <ul> <li> <p> <b>INITIALIZED</b> -- A new build has been defined, but no files have been uploaded. You cannot create fleets for builds that are in this status. When a build is successfully created, the build status is set to this value. </p> </li> <li> <p> <b>READY</b> -- The game build has been successfully uploaded. You can now create new fleets for this build.</p> </li> <li> <p> <b>FAILED</b> -- The game build upload failed. You cannot create new fleets for this build. </p> </li> </ul>
        SizeOnDisk:
          allOf:
          - $ref: '#/components/schemas/PositiveLong'
          - description: File size of the uploaded game build, expressed in bytes. When the build status is <code>INITIALIZED</code> or when using a custom Amazon S3 storage location, this value is 0.
        OperatingSystem:
          allOf:
          - $ref: '#/components/schemas/OperatingSystem'
          - description: Operating system that the game server binaries are built to run on. This value determines the type of fleet resources that you can use for this build.
        CreationTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: A time stamp indicating when this data object was created. Format is a number expressed in Unix time as milliseconds (for example <code>"1469498468.057"</code>).
        ServerSdkVersion:
          allOf:
          - $ref: '#/components/schemas/ServerSdkVersion'
          - description: The Amazon GameLift Server SDK version used to develop your game server.
      description: <p>Properties describing a custom game build.</p> <p> <a href="https://docs.aws.amazon.com/gamelift/latest/developerguide/reference-awssdk.html#reference-awssdk-resources-fleets">All APIs by task</a> </p>
    InternalServiceException: {}
    UpdateBuildInput:
      type: object
      required:
      - BuildId
      title: UpdateBuildInput
      properties:
        BuildId:
          allOf:
          - $ref: '#/components/schemas/BuildIdOrArn'
          - description: 'A unique identifier for the build to update. You can use either the build ID or ARN value. '
        Name:
          allOf:
          - $ref: '#/components/schemas/NonZeroAndMaxString'
          - description: 'A descriptive label associated with a build. Build names don''t need to be unique. '
        Version:
          allOf:
          - $ref: '#/components/schemas/NonZeroAndMaxString'
          - description: Version information associated with a build or script. Version strings don't need to be unique.
    UnauthorizedException: {}
    OperatingSystem:
      type: string
      enum:
      - WINDOWS_2012
      - AMAZON_LINUX
      - AMAZON_LINUX_2
      - WINDOWS_2016
  parameters:
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
