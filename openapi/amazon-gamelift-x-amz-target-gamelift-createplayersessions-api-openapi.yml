paths:
  /#X-Amz-Target=GameLift.CreatePlayerSessions:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: CreatePlayerSessions
      description: 'Reserves open slots in a game session for a group of players. New player sessions can be created in any game session with an open slot that is in ACTIVE status and has a player creation policy of ACCEPT_ALL. To add a single player to a game session, use CreatePlayerSession


        To create player sessions, specify a game session ID and a list of player IDs. Optionally, provide a set of player data for each player ID.


        If successful, a slot is reserved in the game session for each player, and new PlayerSession objects are returned with player session IDs. Each player references their player session ID when sending a connection request to the game session, and the game server can use it to validate the player reservation with the Amazon GameLift service. Player sessions cannot be updated.


        The maximum number of players per game session is 200. It is not adjustable.


        Related actions


        All APIs by task'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePlayerSessionsOutput'
              examples:
                CreatePlayerSessions200Example:
                  summary: Default CreatePlayerSessions 200 response
                  x-microcks-default: true
                  value:
                    PlayerSessions: example-value
        '480':
          description: InternalServiceException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServiceException'
              examples:
                CreatePlayerSessions480Example:
                  summary: Default CreatePlayerSessions 480 response
                  x-microcks-default: true
                  value: example-value
        '481':
          description: UnauthorizedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedException'
              examples:
                CreatePlayerSessions481Example:
                  summary: Default CreatePlayerSessions 481 response
                  x-microcks-default: true
                  value: example-value
        '482':
          description: InvalidGameSessionStatusException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidGameSessionStatusException'
              examples:
                CreatePlayerSessions482Example:
                  summary: Default CreatePlayerSessions 482 response
                  x-microcks-default: true
                  value: example-value
        '483':
          description: GameSessionFullException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameSessionFullException'
              examples:
                CreatePlayerSessions483Example:
                  summary: Default CreatePlayerSessions 483 response
                  x-microcks-default: true
                  value: example-value
        '484':
          description: TerminalRoutingStrategyException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalRoutingStrategyException'
              examples:
                CreatePlayerSessions484Example:
                  summary: Default CreatePlayerSessions 484 response
                  x-microcks-default: true
                  value: example-value
        '485':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
              examples:
                CreatePlayerSessions485Example:
                  summary: Default CreatePlayerSessions 485 response
                  x-microcks-default: true
                  value: example-value
        '486':
          description: NotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundException'
              examples:
                CreatePlayerSessions486Example:
                  summary: Default CreatePlayerSessions 486 response
                  x-microcks-default: true
                  value: example-value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlayerSessionsInput'
