tags:
- name: '#X Amz Target=GameLift.RequestUploadCredentials'
paths:
  /#X-Amz-Target=GameLift.RequestUploadCredentials:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: RequestUploadCredentials
      description: <p>Retrieves a fresh set of credentials for use when uploading a new set of game build files to Amazon GameLift's Amazon S3. This is done as part of the build creation process; see <a href="https://docs.aws.amazon.com/gamelift/latest/apireference/API_CreateBuild.html">GameSession</a>.</p> <p>To request new credentials, specify the build ID as returned with an initial <code>CreateBuild</code> request. If successful, a new set of credentials are returned, along with the S3 storage location associated with the build ID.</p> <p> <b>Learn more</b> </p> <p> <a href="https://docs.aws.amazon.com/gamelift/latest/developerguide/gamelift-build-cli-uploading.html#gamelift-build-cli-uploading-create-build"> Create a Build with Files in S3</a> </p> <p> <a href="https://docs.aws.amazon.com/gamelift/latest/developerguide/reference-awssdk.html#reference-awssdk-resources-fleets">All APIs by task</a> </p>
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestUploadCredentialsOutput'
              examples:
                RequestUploadCredentials200Example:
                  summary: Default RequestUploadCredentials 200 response
                  x-microcks-default: true
                  value:
                    UploadCredentials: example-value
                    StorageLocation: example-value
        '480':
          description: UnauthorizedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedException'
              examples:
                RequestUploadCredentials480Example:
                  summary: Default RequestUploadCredentials 480 response
                  x-microcks-default: true
                  value: example-value
        '481':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
              examples:
                RequestUploadCredentials481Example:
                  summary: Default RequestUploadCredentials 481 response
                  x-microcks-default: true
                  value: example-value
        '482':
          description: NotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundException'
              examples:
                RequestUploadCredentials482Example:
                  summary: Default RequestUploadCredentials 482 response
                  x-microcks-default: true
                  value: example-value
        '483':
          description: InternalServiceException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServiceException'
              examples:
                RequestUploadCredentials483Example:
                  summary: Default RequestUploadCredentials 483 response
                  x-microcks-default: true
                  value: example-value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestUploadCredentialsInput'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - GameLift.RequestUploadCredentials
      summary: Amazon GameLift Request Upload Credentials
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=GameLift.RequestUploadCredentials'
components:
  parameters:
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
  schemas:
    InvalidRequestException: {}
    BuildIdOrArn:
      type: string
      pattern: ^build-\S+|^arn:.*:build\/build-\S+
    S3Location:
      type: object
      properties:
        Bucket:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          - description: <p>An Amazon S3 bucket identifier. Thename of the S3 bucket.</p> <note> <p>Amazon GameLift doesn't support uploading from Amazon S3 buckets with names that contain a dot (.).</p> </note>
        Key:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          - description: 'The name of the zip file that contains the build files or script files. '
        RoleArn:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          - description: The Amazon Resource Name (<a href="https://docs.aws.amazon.com/AmazonS3/latest/dev/s3-arn-format.html">ARN</a>) for an IAM role that allows Amazon GameLift to access the S3 bucket.
        ObjectVersion:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          - description: 'The version of the file, if object versioning is turned on for the bucket. Amazon GameLift uses this information when retrieving files from an S3 bucket that you own. Use this parameter to specify a specific version of the file. If not set, the latest version of the file is retrieved. '
      description: The location in Amazon S3 where build or script files are stored for access by Amazon GameLift.
    NotFoundException: {}
    RequestUploadCredentialsOutput:
      type: object
      properties:
        UploadCredentials:
          allOf:
          - $ref: '#/components/schemas/AwsCredentials'
          - description: Amazon Web Services credentials required when uploading a game build to the storage location. These credentials have a limited lifespan and are valid only for the build they were issued for.
        StorageLocation:
          allOf:
          - $ref: '#/components/schemas/S3Location'
          - description: Amazon S3 path and key, identifying where the game build files are stored.
    RequestUploadCredentialsInput:
      type: object
      required:
      - BuildId
      title: RequestUploadCredentialsInput
      properties:
        BuildId:
          allOf:
          - $ref: '#/components/schemas/BuildIdOrArn'
          - description: 'A unique identifier for the build to get credentials for. You can use either the build ID or ARN value. '
    InternalServiceException: {}
    AwsCredentials:
      type: object
      properties:
        AccessKeyId:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          - description: Temporary key allowing access to the Amazon GameLift S3 account.
        SecretAccessKey:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          - description: Temporary secret key allowing access to the Amazon GameLift S3 account.
        SessionToken:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          - description: Token used to associate a specific build ID with the files uploaded using these credentials.
      description: Temporary access credentials used for uploading game build files to Amazon GameLift. They are valid for a limited time. If they expire before you upload your game build, get a new set by calling <a href="https://docs.aws.amazon.com/gamelift/latest/apireference/API_RequestUploadCredentials.html">RequestUploadCredentials</a>.
    UnauthorizedException: {}
    NonEmptyString:
      type: string
      minLength: 1
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
externalDocs:
  description: Amazon Web Services documentation
  url: https://docs.aws.amazon.com/gamelift/
