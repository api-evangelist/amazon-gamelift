tags:
- name: '#X Amz Target=GameLift.StartMatchmaking'
paths:
  /#X-Amz-Target=GameLift.StartMatchmaking:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: StartMatchmaking
      description: <p>Uses FlexMatch to create a game match for a group of players based on custom matchmaking rules. With games that use Amazon GameLift managed hosting, this operation also triggers Amazon GameLift to find hosting resources and start a new game session for the new match. Each matchmaking request includes information on one or more players and specifies the FlexMatch matchmaker to use. When a request is for multiple players, FlexMatch attempts to build a match that includes all players in the request, placing them in the same team and finding additional players as needed to fill the match. </p> <p>To start matchmaking, provide a unique ticket ID, specify a matchmaking configuration, and include the players to be matched. You must also include any player attributes that are required by the matchmaking configuration's rule set. If successful, a matchmaking ticket is returned with status set to <code>QUEUED</code>. </p> <p>Track matchmaking events to respond as needed and acquire game session connection information for successfully completed matches. Ticket status updates are tracked using event notification through Amazon Simple Notification Service, which is defined in the matchmaking configuration.</p> <p> <b>Learn more</b> </p> <p> <a href="https://docs.aws.amazon.com/gamelift/latest/flexmatchguide/match-client.html"> Add FlexMatch to a game client</a> </p> <p> <a href="https://docs.aws.amazon.com/gamelift/latest/flexmatchguide/match-notification.html"> Set Up FlexMatch event notification</a> </p> <p> <a href="https://docs.aws.amazon.com/gamelift/latest/flexmatchguide/gamelift-match.html"> How Amazon GameLift FlexMatch works</a> </p>
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartMatchmakingOutput'
              examples:
                StartMatchmaking200Example:
                  summary: Default StartMatchmaking 200 response
                  x-microcks-default: true
                  value:
                    MatchmakingTicket: example-value
        '480':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
              examples:
                StartMatchmaking480Example:
                  summary: Default StartMatchmaking 480 response
                  x-microcks-default: true
                  value: example-value
        '481':
          description: NotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundException'
              examples:
                StartMatchmaking481Example:
                  summary: Default StartMatchmaking 481 response
                  x-microcks-default: true
                  value: example-value
        '482':
          description: InternalServiceException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServiceException'
              examples:
                StartMatchmaking482Example:
                  summary: Default StartMatchmaking 482 response
                  x-microcks-default: true
                  value: example-value
        '483':
          description: UnsupportedRegionException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsupportedRegionException'
              examples:
                StartMatchmaking483Example:
                  summary: Default StartMatchmaking 483 response
                  x-microcks-default: true
                  value: example-value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartMatchmakingInput'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - GameLift.StartMatchmaking
      summary: Amazon GameLift Start Matchmaking
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=GameLift.StartMatchmaking'
components:
  parameters:
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
  schemas:
    AttributeValue:
      type: object
      properties:
        S:
          allOf:
          - $ref: '#/components/schemas/PlayerAttributeString'
          - description: For single string values. Maximum string length is 100 characters.
        N:
          allOf:
          - $ref: '#/components/schemas/DoubleObject'
          - description: For number values, expressed as double.
        SL:
          allOf:
          - $ref: '#/components/schemas/PlayerAttributeStringList'
          - description: For a list of up to 100 strings. Maximum length for each string is 100 characters. Duplicate values are not recognized; all occurrences of the repeated value after the first of a repeated value are ignored.
        SDM:
          allOf:
          - $ref: '#/components/schemas/PlayerAttributeStringDoubleMap'
          - description: 'For a map of up to 10 data type:value pairs. Maximum length for each string value is 100 characters. '
      description: 'Values for use in player attribute key-value pairs. This object lets you specify an attribute value using any of the valid data types: string, number, string array, or data map. Each <code>AttributeValue</code> object can use only one of the available properties.'
    MatchedPlayerSession:
      type: object
      properties:
        PlayerId:
          allOf:
          - $ref: '#/components/schemas/NonZeroAndMaxString'
          - description: 'A unique identifier for a player '
        PlayerSessionId:
          allOf:
          - $ref: '#/components/schemas/PlayerSessionId'
          - description: A unique identifier for a player session
      description: <p>Represents a new player session that is created as a result of a successful FlexMatch match. A successful match automatically creates new player sessions for every player ID in the original matchmaking request. </p> <p>When players connect to the match's game session, they must include both player ID and player session ID in order to claim their assigned player slot.</p>
    PlayerAttributeString:
      type: string
      minLength: 1
      maxLength: 100
    PlayerAttributeStringList:
      type: array
      items:
        $ref: '#/components/schemas/PlayerAttributeString'
    PlayerAttributeMap:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/AttributeValue'
    InvalidRequestException: {}
    MatchmakingIdStringModel:
      type: string
      pattern: '[a-zA-Z0-9-\.]*'
      maxLength: 128
    MatchedPlayerSessionList:
      type: array
      items:
        $ref: '#/components/schemas/MatchedPlayerSession'
    PlayerSessionId:
      type: string
      pattern: ^psess-\S+
    Timestamp:
      type: string
      format: date-time
    IpAddress:
      type: string
      pattern: ^[0-9A-Fa-f\:\.]+
      minLength: 1
      maxLength: 128
    DoubleObject:
      type: number
      format: double
    StartMatchmakingInput:
      type: object
      required:
      - ConfigurationName
      - Players
      title: StartMatchmakingInput
      properties:
        TicketId:
          allOf:
          - $ref: '#/components/schemas/MatchmakingIdStringModel'
          - description: A unique identifier for a matchmaking ticket. If no ticket ID is specified here, Amazon GameLift will generate one in the form of a UUID. Use this identifier to track the matchmaking ticket status and retrieve match results.
        ConfigurationName:
          allOf:
          - $ref: '#/components/schemas/MatchmakingConfigurationName'
          - description: Name of the matchmaking configuration to use for this request. Matchmaking configurations must exist in the same Region as this request. You can use either the configuration name or ARN value.
        Players:
          allOf:
          - $ref: '#/components/schemas/PlayerList'
          - description: <p>Information on each player to be matched. This information must include a player ID, and may contain player attributes and latency data to be used in the matchmaking process. After a successful match, <code>Player</code> objects contain the name of the team the player is assigned to.</p> <p>You can include up to 10 <code>Players</code> in a <code>StartMatchmaking</code> request.</p>
    MatchmakingConfigurationName:
      type: string
      pattern: '[a-zA-Z0-9-\.]*|^arn:.*:matchmakingconfiguration\/[a-zA-Z0-9-\.]*'
      minLength: 1
      maxLength: 256
    MatchmakingConfigurationStatus:
      type: string
      enum:
      - CANCELLED
      - COMPLETED
      - FAILED
      - PLACING
      - QUEUED
      - REQUIRES_ACCEPTANCE
      - SEARCHING
      - TIMED_OUT
    MatchmakingConfigurationArn:
      type: string
      pattern: ^arn:.*:matchmakingconfiguration\/[a-zA-Z0-9-\.]*
      description: Data type used for Matchmaking Configuration ARN.
    PositiveInteger:
      type: integer
      minimum: 1
    GameSessionConnectionInfo:
      type: object
      properties:
        GameSessionArn:
          allOf:
          - $ref: '#/components/schemas/ArnStringModel'
          - description: A unique identifier for the game session. Use the game session ID.
        IpAddress:
          allOf:
          - $ref: '#/components/schemas/IpAddress'
          - description: The IP address of the game session. To connect to a Amazon GameLift game server, an app needs both the IP address and port number.
        DnsName:
          allOf:
          - $ref: '#/components/schemas/DnsName'
          - description: '<p>The DNS identifier assigned to the instance that is running the game session. Values have the following format:</p> <ul> <li> <p>TLS-enabled fleets: <code>&lt;unique identifier&gt;.&lt;region identifier&gt;.amazongamelift.com</code>.</p> </li> <li> <p>Non-TLS-enabled fleets: <code>ec2-&lt;unique identifier&gt;.compute.amazonaws.com</code>. (See <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-instance-addressing.html#concepts-public-addresses">Amazon EC2 Instance IP Addressing</a>.)</p> </li> </ul> <p>When connecting to a game session that is running on a TLS-enabled fleet, you must use the DNS name, not the IP address.</p>'
        Port:
          allOf:
          - $ref: '#/components/schemas/PositiveInteger'
          - description: The port number for the game session. To connect to a Amazon GameLift game server, an app needs both the IP address and port number.
        MatchedPlayerSessions:
          allOf:
          - $ref: '#/components/schemas/MatchedPlayerSessionList'
          - description: 'A collection of player session IDs, one for each player ID that was included in the original matchmaking request. '
      description: Connection information for a new game session that is created in response to a start matchmaking request. Once a match is made, the FlexMatch engine creates a new game session for it. This information, including the game session endpoint and player sessions for each player in the original matchmaking request, is added to the matchmaking ticket.
    NotFoundException: {}
    Player:
      type: object
      properties:
        PlayerId:
          allOf:
          - $ref: '#/components/schemas/NonZeroAndMaxString'
          - description: A unique identifier for a player
        PlayerAttributes:
          allOf:
          - $ref: '#/components/schemas/PlayerAttributeMap'
          - description: '<p>A collection of key:value pairs containing player information for use in matchmaking. Player attribute keys must match the <i>playerAttributes</i> used in a matchmaking rule set. Example: <code>"PlayerAttributes": {"skill": {"N": "23"}, "gameMode": {"S": "deathmatch"}}</code>.</p> <p>You can provide up to 10 <code>PlayerAttributes</code>.</p>'
        Team:
          allOf:
          - $ref: '#/components/schemas/NonZeroAndMaxString'
          - description: Name of the team that the player is assigned to in a match. Team names are defined in a matchmaking rule set.
        LatencyInMs:
          allOf:
          - $ref: '#/components/schemas/LatencyMap'
          - description: <p>A set of values, expressed in milliseconds, that indicates the amount of latency that a player experiences when connected to @aws; Regions. If this property is present, FlexMatch considers placing the match only in Regions for which latency is reported. </p> <p>If a matchmaker has a rule that evaluates player latency, players must report latency in order to be matched. If no latency is reported in this scenario, FlexMatch assumes that no Regions are available to the player and the ticket is not matchable. </p>
      description: Represents a player in matchmaking. When starting a matchmaking request, a player has a player ID, attributes, and may have latency data. Team information is added after a match has been successfully completed.
    PlayerList:
      type: array
      items:
        $ref: '#/components/schemas/Player'
    NonZeroAndMaxString:
      type: string
      minLength: 1
      maxLength: 1024
    StringModel:
      type: string
    DnsName:
      type: string
    InternalServiceException: {}
    MatchmakingTicket:
      type: object
      properties:
        TicketId:
          allOf:
          - $ref: '#/components/schemas/MatchmakingIdStringModel'
          - description: A unique identifier for a matchmaking ticket.
        ConfigurationName:
          allOf:
          - $ref: '#/components/schemas/MatchmakingIdStringModel'
          - description: Name of the matchmaking configuration that is used with this ticket. Matchmaking configurations determine how players are grouped into a match and how a new game session is created for the match.
        ConfigurationArn:
          allOf:
          - $ref: '#/components/schemas/MatchmakingConfigurationArn'
          - description: The Amazon Resource Name (<a href="https://docs.aws.amazon.com/AmazonS3/latest/dev/s3-arn-format.html">ARN</a>) associated with the GameLift matchmaking configuration resource that is used with this ticket.
        Status:
          allOf:
          - $ref: '#/components/schemas/MatchmakingConfigurationStatus'
          - description: <p>Current status of the matchmaking request.</p> <ul> <li> <p> <b>QUEUED</b> -- The matchmaking request has been received and is currently waiting to be processed.</p> </li> <li> <p> <b>SEARCHING</b> -- The matchmaking request is currently being processed. </p> </li> <li> <p> <b>REQUIRES_ACCEPTANCE</b> -- A match has been proposed and the players must accept the match. This status is used only with requests that use a matchmaking configuration with a player acceptance requirement.</p> </li> <li> <p> <b>PLACING</b> -- The FlexMatch engine has matched players and is in the process of placing a new game session for the match.</p> </li> <li> <p> <b>COMPLETED</b> -- Players have been matched and a game session is ready to host the players. A ticket in this state contains the necessary connection information for players.</p> </li> <li> <p> <b>FAILED</b> -- The matchmaking request was not completed.</p> </li> <li> <p> <b>CANCELLED</b> -- The matchmaking request was canceled. This may be the result of a <code>StopMatchmaking</code> operation or a proposed match that one or more players failed to accept.</p> </li> <li> <p> <b>TIMED_OUT</b> -- The matchmaking request was not successful within the duration specified in the matchmaking configuration. </p> </li> </ul> <note> <p>Matchmaking requests that fail to successfully complete (statuses FAILED, CANCELLED, TIMED_OUT) can be resubmitted as new requests with new ticket IDs.</p> </note>
        StatusReason:
          allOf:
          - $ref: '#/components/schemas/StringModel'
          - description: Code to explain the current status. For example, a status reason may indicate when a ticket has returned to <code>SEARCHING</code> status after a proposed match fails to receive player acceptances.
        StatusMessage:
          allOf:
          - $ref: '#/components/schemas/StringModel'
          - description: Additional information about the current status.
        StartTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: Time stamp indicating when this matchmaking request was received. Format is a number expressed in Unix time as milliseconds (for example <code>"1469498468.057"</code>).
        EndTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: Time stamp indicating when the matchmaking request stopped being processed due to successful completion, timeout, or cancellation. Format is a number expressed in Unix time as milliseconds (for example <code>"1469498468.057"</code>).
        Players:
          allOf:
          - $ref: '#/components/schemas/PlayerList'
          - description: A set of <code>Player</code> objects, each representing a player to find matches for. Players are identified by a unique player ID and may include latency data for use during matchmaking. If the ticket is in status <code>COMPLETED</code>, the <code>Player</code> objects include the team the players were assigned to in the resulting match.
        GameSessionConnectionInfo:
          allOf:
          - $ref: '#/components/schemas/GameSessionConnectionInfo'
          - description: Connection information for a new game session. Once a match is made, the FlexMatch engine creates a new game session for it. This information is added to the matchmaking ticket, which you can be retrieve by calling <a href="https://docs.aws.amazon.com/gamelift/latest/apireference/API_DescribeMatchmaking.html">DescribeMatchmaking</a> .
        EstimatedWaitTime:
          allOf:
          - $ref: '#/components/schemas/WholeNumber'
          - description: Average amount of time (in seconds) that players are currently waiting for a match. If there is not enough recent data, this property may be empty.
      description: Ticket generated to track the progress of a matchmaking request. Each ticket is uniquely identified by a ticket ID, supplied by the requester, when creating a matchmaking request.
    StartMatchmakingOutput:
      type: object
      properties:
        MatchmakingTicket:
          allOf:
          - $ref: '#/components/schemas/MatchmakingTicket'
          - description: Ticket representing the matchmaking request. This object include the information included in the request, ticket status, and match results as generated during the matchmaking process.
    WholeNumber:
      type: integer
      minimum: 0
    ArnStringModel:
      type: string
      pattern: '[a-zA-Z0-9:/-]+'
      minLength: 1
      maxLength: 256
    UnsupportedRegionException: {}
    PlayerAttributeStringDoubleMap:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/DoubleObject'
    LatencyMap:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/PositiveInteger'
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
