      title: UntagResourceRequest
      properties:
        ResourceARN:
          allOf:
          - $ref: '#/components/schemas/AmazonResourceName'
          - description: 'The Amazon Resource Name (<a href="https://docs.aws.amazon.com/AmazonS3/latest/dev/s3-arn-format.html">ARN</a>) that uniquely identifies the Amazon GameLift resource that you want to remove tags from. Amazon GameLift includes resource ARNs in the data object for the resource. You can retrieve the ARN by calling a <code>List</code> or <code>Describe</code> operation for the resource type. '
        TagKeys:
          allOf:
          - $ref: '#/components/schemas/TagKeyList'
          - description: 'A list of one or more tag keys to remove from the specified Amazon GameLift resource. '
