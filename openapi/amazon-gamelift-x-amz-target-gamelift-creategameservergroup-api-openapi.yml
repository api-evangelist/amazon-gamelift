components:
  schemas:
    IamRoleArn:
      type: string
      pattern: ^arn:.*:role\/[\w+=,.@-]+
      minLength: 1
      maxLength: 256
    ConflictException: {}
    TargetTrackingConfiguration:
      type: object
      required:
      - TargetValue
      properties:
        TargetValue:
          allOf:
          - $ref: '#/components/schemas/NonNegativeDouble'
          - description: 'Desired value to use with a game server group target-based scaling policy. '
      description: <p> <b>This data type is used with the Amazon GameLift FleetIQ and game server groups.</b> </p> <p>Settings for a target-based scaling policy as part of a <a href="https://docs.aws.amazon.com/gamelift/latest/apireference/API_GameServerGroupAutoScalingPolicy.html">GameServerGroupAutoScalingPolicy</a> . These settings are used to create a target-based policy that tracks the Amazon GameLift FleetIQ metric <code>"PercentUtilizedGameServers"</code> and specifies a target value for the metric. As player usage changes, the policy triggers to adjust the game server group capacity so that the metric returns to the target value. </p>
    LaunchTemplateSpecification:
      type: object
      properties:
        LaunchTemplateId:
          allOf:
          - $ref: '#/components/schemas/LaunchTemplateId'
          - description: A unique identifier for an existing Amazon EC2 launch template.
        LaunchTemplateName:
          allOf:
          - $ref: '#/components/schemas/LaunchTemplateName'
          - description: 'A readable identifier for an existing Amazon EC2 launch template. '
        Version:
          allOf:
          - $ref: '#/components/schemas/LaunchTemplateVersion'
          - description: The version of the Amazon EC2 launch template to use. If no version is specified, the default version will be used. With Amazon EC2, you can specify a default version for a launch template. If none is set, the default is the first version created.
      description: <p> <b>This data type is used with the Amazon GameLift FleetIQ and game server groups.</b> </p> <p>An Amazon Elastic Compute Cloud launch template that contains configuration settings and game server code to be deployed to all instances in a game server group. The launch template is specified when creating a new game server group. </p>
    CreateGameServerGroupOutput:
      type: object
      properties:
        GameServerGroup:
          allOf:
          - $ref: '#/components/schemas/GameServerGroup'
          - description: 'The newly created game server group object, including the new ARN value for the Amazon GameLift FleetIQ game server group and the object''s status. The Amazon EC2 Auto Scaling group ARN is initially null, since the group has not yet been created. This value is added once the game server group status reaches <code>ACTIVE</code>. '
    VpcSubnets:
      type: array
      items:
        $ref: '#/components/schemas/VpcSubnet'
      minItems: 1
      maxItems: 20
    NonNegativeDouble:
      type: number
      format: double
      minimum: 0
    NonZeroAndMaxString:
      type: string
      minLength: 1
      maxLength: 1024
    LaunchTemplateName:
      type: string
      pattern: '[a-zA-Z0-9\(\)\.\-/_]+'
      minLength: 3
      maxLength: 128
    GameServerGroupActions:
      type: array
      items:
        $ref: '#/components/schemas/GameServerGroupAction'
      minItems: 1
      maxItems: 1
    WeightedCapacity:
      type: string
      pattern: ^[\u0031-\u0039][\u0030-\u0039]{0,2}$
      minLength: 1
      maxLength: 3
    InternalServiceException: {}
    WholeNumber:
      type: integer
      minimum: 0
    GameServerGroup:
      type: object
      properties:
        GameServerGroupName:
          allOf:
          - $ref: '#/components/schemas/GameServerGroupName'
          - description: A developer-defined identifier for the game server group. The name is unique for each Region in each Amazon Web Services account.
        GameServerGroupArn:
          allOf:
          - $ref: '#/components/schemas/GameServerGroupArn'
          - description: A generated unique ID for the game server group.
        RoleArn:
          allOf:
          - $ref: '#/components/schemas/IamRoleArn'
          - description: The Amazon Resource Name (<a href="https://docs.aws.amazon.com/AmazonS3/latest/dev/s3-arn-format.html">ARN</a>) for an IAM role that allows Amazon GameLift to access your Amazon EC2 Auto Scaling groups.
        InstanceDefinitions:
          allOf:
          - $ref: '#/components/schemas/InstanceDefinitions'
          - description: 'The set of Amazon EC2 instance types that Amazon GameLift FleetIQ can use when balancing and automatically scaling instances in the corresponding Auto Scaling group. '
        BalancingStrategy:
          allOf:
          - $ref: '#/components/schemas/BalancingStrategy'
          - description: <p>Indicates how Amazon GameLift FleetIQ balances the use of Spot Instances and On-Demand Instances in the game server group. Method options include the following:</p> <ul> <li> <p> <code>SPOT_ONLY</code> - Only Spot Instances are used in the game server group. If Spot Instances are unavailable or not viable for game hosting, the game server group provides no hosting capacity until Spot Instances can again be used. Until then, no new instances are started, and the existing nonviable Spot Instances are terminated (after current gameplay ends) and are not replaced.</p> </li> <li> <p> <code>SPOT_PREFERRED</code> - (default value) Spot Instances are used whenever available in the game server group. If Spot Instances are unavailable, the game server group continues to provide hosting capacity by falling back to On-Demand Instances. Existing nonviable Spot Instances are terminated (after current gameplay ends) and are replaced with new On-Demand Instances.</p> </li> <li> <p> <code>ON_DEMAND_ONLY</code> - Only On-Demand Instances are used in the game server group. No Spot Instances are used, even when available, while this balancing strategy is in force.</p> </li> </ul>
        GameServerProtectionPolicy:
          allOf:
          - $ref: '#/components/schemas/GameServerProtectionPolicy'
          - description: 'A flag that indicates whether instances in the game server group are protected from early termination. Unprotected instances that have active game servers running might be terminated during a scale-down event, causing players to be dropped from the game. Protected instances cannot be terminated while there are active game servers running except in the event of a forced game server group deletion (see ). An exception to this is with Spot Instances, which can be terminated by Amazon Web Services regardless of protection status. '
        AutoScalingGroupArn:
          allOf:
          - $ref: '#/components/schemas/AutoScalingGroupArn'
          - description: A generated unique ID for the Amazon EC2 Auto Scaling group that is associated with this game server group.
        Status:
          allOf:
          - $ref: '#/components/schemas/GameServerGroupStatus'
          - description: <p>The current status of the game server group. Possible statuses include:</p> <ul> <li> <p> <code>NEW</code> - Amazon GameLift FleetIQ has validated the <code>CreateGameServerGroup()</code> request. </p> </li> <li> <p> <code>ACTIVATING</code> - Amazon GameLift FleetIQ is setting up a game server group, which includes creating an Auto Scaling group in your Amazon Web Services account. </p> </li> <li> <p> <code>ACTIVE</code> - The game server group has been successfully created. </p> </li> <li> <p> <code>DELETE_SCHEDULED</code> - A request to delete the game server group has been received. </p> </li> <li> <p> <code>DELETING</code> - Amazon GameLift FleetIQ has received a valid <code>DeleteGameServerGroup()</code> request and is processing it. Amazon GameLift FleetIQ must first complete and release hosts before it deletes the Auto Scaling group and the game server group. </p> </li> <li> <p> <code>DELETED</code> - The game server group has been successfully deleted. </p> </li> <li> <p> <code>ERROR</code> - The asynchronous processes of activating or deleting a game server group has failed, resulting in an error state.</p> </li> </ul>
        StatusReason:
          allOf:
          - $ref: '#/components/schemas/NonZeroAndMaxString'
          - description: Additional information about the current game server group status. This information might provide additional insight on groups that are in <code>ERROR</code> status.
        SuspendedActions:
          allOf:
          - $ref: '#/components/schemas/GameServerGroupActions'
          - description: A list of activities that are currently suspended for this game server group. If this property is empty, all activities are occurring.
        CreationTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: A time stamp indicating when this data object was created. Format is a number expressed in Unix time as milliseconds (for example <code>"1469498468.057"</code>).
        LastUpdatedTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: A timestamp that indicates when this game server group was last updated.
      description: <p> <b>This data type is used with the Amazon GameLift FleetIQ and game server groups.</b> </p> <p>Properties that describe a game server group resource. A game server group manages certain properties related to a corresponding Amazon EC2 Auto Scaling group. </p> <p>A game server group is created by a successful call to <code>CreateGameServerGroup</code> and deleted by calling <code>DeleteGameServerGroup</code>. Game server group activity can be temporarily suspended and resumed by calling <code>SuspendGameServerGroup</code> and <code>ResumeGameServerGroup</code>, respectively. </p>
    InstanceDefinitions:
      type: array
      items:
        $ref: '#/components/schemas/InstanceDefinition'
      minItems: 2
      maxItems: 20
    GameServerGroupArn:
      type: string
      pattern: ^arn:.*:gameservergroup\/[a-zA-Z0-9-\.]*
      minLength: 1
      maxLength: 256
    LaunchTemplateId:
      type: string
      minLength: 1
      maxLength: 255
      x-pattern: '[\u0020-\uD7FF\uE000-\uFFFD\uD800\uDC00-\uDBFF\uDFFF\r\n\t]\+'
    GameServerGroupInstanceType:
      type: string
      enum:
      - c4.large
      - c4.xlarge
      - c4.2xlarge
      - c4.4xlarge
      - c4.8xlarge
      - c5.large
      - c5.xlarge
