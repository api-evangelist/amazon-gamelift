    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: DeleteLocation
      description: 'Deletes a custom location.


        Before deleting a custom location, review any fleets currently using the custom location and deregister the location if it is in use. For more information see, DeregisterCompute.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteLocationOutput'
              examples:
                DeleteLocation200Example:
                  summary: Default DeleteLocation 200 response
                  x-microcks-default: true
                  value: {}
        '480':
          description: UnauthorizedException
