tags:
- name: '#X Amz Target=GameLift.GetComputeAuthToken'
paths:
  /#X-Amz-Target=GameLift.GetComputeAuthToken:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: GetComputeAuthToken
      description: Requests an authentication token from Amazon GameLift. The authentication token is used by your game server to authenticate with Amazon GameLift. Each authentication token has an expiration time. To continue using the compute resource to host your game server, regularly retrieve a new authorization token.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetComputeAuthTokenOutput'
              examples:
                GetComputeAuthToken200Example:
                  summary: Default GetComputeAuthToken 200 response
                  x-microcks-default: true
                  value:
                    FleetId: fleet-1a2b3c4d-5678-90ab-cdef-1234567890ab
                    FleetArn: arn:aws:gamelift:us-east-1:123456789012:fleet/fleet-1a2b3c4d
                    ComputeName: MyGameFleet
                    ComputeArn: arn:aws:gamelift:us-east-1:123456789012:fleet/fleet-1a2b3c4d
                    AuthToken: example-value
                    ExpirationTimestamp: example-value
        '480':
          description: UnauthorizedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedException'
              examples:
                GetComputeAuthToken480Example:
                  summary: Default GetComputeAuthToken 480 response
                  x-microcks-default: true
                  value: example-value
        '481':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
              examples:
                GetComputeAuthToken481Example:
                  summary: Default GetComputeAuthToken 481 response
                  x-microcks-default: true
                  value: example-value
        '482':
          description: NotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundException'
              examples:
                GetComputeAuthToken482Example:
                  summary: Default GetComputeAuthToken 482 response
                  x-microcks-default: true
                  value: example-value
        '483':
          description: InternalServiceException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServiceException'
              examples:
                GetComputeAuthToken483Example:
                  summary: Default GetComputeAuthToken 483 response
                  x-microcks-default: true
                  value: example-value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetComputeAuthTokenInput'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - GameLift.GetComputeAuthToken
      summary: Amazon GameLift Get Compute Auth Token
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=GameLift.GetComputeAuthToken'
components:
  schemas:
    ComputeArn:
      type: string
      pattern: ^arn:.*:compute\/[a-zA-Z0-9\-]+
      maxLength: 1024
    InternalServiceException: {}
    FleetArn:
      type: string
      pattern: ^arn:.*:fleet\/fleet-\S+
    FleetIdOrArn:
      type: string
      pattern: ^fleet-\S+|^arn:.*:fleet\/fleet-\S+
    GetComputeAuthTokenInput:
      type: object
      required:
      - FleetId
      - ComputeName
      title: GetComputeAuthTokenInput
      properties:
        FleetId:
          allOf:
          - $ref: '#/components/schemas/FleetIdOrArn'
          - description: A unique identifier for the fleet that the compute is registered to.
        ComputeName:
          allOf:
          - $ref: '#/components/schemas/ComputeNameOrArn'
          - description: The name of the compute resource you are requesting the authentication token for.
    InvalidRequestException: {}
    NotFoundException: {}
    ComputeAuthToken:
      type: string
      pattern: ^[a-zA-Z0-9\-]+
      minLength: 1
      maxLength: 64
    UnauthorizedException: {}
    Timestamp:
      type: string
      format: date-time
    GetComputeAuthTokenOutput:
      type: object
      properties:
        FleetId:
          allOf:
          - $ref: '#/components/schemas/FleetIdOrArn'
          - description: A unique identifier for the fleet that the compute is registered to.
        FleetArn:
          allOf:
          - $ref: '#/components/schemas/FleetArn'
          - description: The Amazon Resource Name (<a href="https://docs.aws.amazon.com/AmazonS3/latest/dev/s3-arn-format.html">ARN</a>) that is assigned to a Amazon GameLift fleet resource and uniquely identifies it. ARNs are unique across all Regions. Format is <code>arn:aws:gamelift:&lt;region&gt;::fleet/fleet-a1234567-b8c9-0d1e-2fa3-b45c6d7e8912</code>.
        ComputeName:
          allOf:
          - $ref: '#/components/schemas/ComputeNameOrArn'
          - description: The name of the compute resource you are requesting the authentication token for.
        ComputeArn:
          allOf:
          - $ref: '#/components/schemas/ComputeArn'
          - description: 'The Amazon Resource Name (<a href="https://docs.aws.amazon.com/AmazonS3/latest/dev/s3-arn-format.html">ARN</a>) that is assigned to a Amazon GameLift compute resource and uniquely identifies it. ARNs are unique across all Regions. Format is <code>arn:aws:gamelift:&lt;region&gt;::compute/compute-a1234567-b8c9-0d1e-2fa3-b45c6d7e8912</code> '
        AuthToken:
          allOf:
          - $ref: '#/components/schemas/ComputeAuthToken'
          - description: The authentication token that your game server uses to authenticate with Amazon GameLift.
        ExpirationTimestamp:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: The amount of time until the authentication token is no longer valid. To continue using the compute resource for game server hosting, renew the authentication token by using this operation again.
    ComputeNameOrArn:
      type: string
      pattern: '[a-zA-Z0-9\-]+|^arn:.*:compute\/[a-zA-Z0-9\-]+'
      maxLength: 1024
  parameters:
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
