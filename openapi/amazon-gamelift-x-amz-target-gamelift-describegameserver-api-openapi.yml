    post:
      operationId: DescribeGameServer
      description: 'This operation is used with the Amazon GameLift FleetIQ solution and game server groups.


        Retrieves information for a registered game server. Information includes game server status, health check info, and the instance that the game server is running on.


        To retrieve game server information, specify the game server ID. If successful, the requested game server object is returned.


        Learn more


        Amazon GameLift FleetIQ Guide'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescribeGameServerOutput'
              examples:
                DescribeGameServer200Example:
                  summary: Default DescribeGameServer 200 response
                  x-microcks-default: true
                  value:
                    GameServer: example-value
        '480':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
              examples:
                DescribeGameServer480Example:
                  summary: Default DescribeGameServer 480 response
                  x-microcks-default: true
                  value: example-value
        '481':
          description: NotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundException'
              examples:
                DescribeGameServer481Example:
                  summary: Default DescribeGameServer 481 response
                  x-microcks-default: true
                  value: example-value
        '482':
          description: UnauthorizedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedException'
              examples:
                DescribeGameServer482Example:
                  summary: Default DescribeGameServer 482 response
                  x-microcks-default: true
                  value: example-value
        '483':
          description: InternalServiceException
          content:
