          - GameLift.DescribeFleetUtilization
      summary: Amazon GameLift Describe Fleet Utilization
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=GameLift.DescribeFleetUtilization'
components:
  schemas:
    NonZeroAndMaxString:
      type: string
      minLength: 1
      maxLength: 1024
    FleetId:
      type: string
      pattern: ^fleet-\S+
    InternalServiceException: {}
    WholeNumber:
      type: integer
      minimum: 0
    FleetArn:
      type: string
      pattern: ^arn:.*:fleet\/fleet-\S+
    FleetUtilizationList:
      type: array
      items:
        $ref: '#/components/schemas/FleetUtilization'
    DescribeFleetUtilizationOutput:
      type: object
      properties:
        FleetUtilization:
          allOf:
          - $ref: '#/components/schemas/FleetUtilizationList'
          - description: A collection of objects containing utilization information for each requested fleet ID. Utilization objects are returned only for fleets that currently exist.
        NextToken:
          allOf:
          - $ref: '#/components/schemas/NonZeroAndMaxString'
          - description: A token that indicates where to resume retrieving results on the next call to this operation. If no token is returned, these results represent the end of the list.
    FleetIdOrArnList:
      type: array
      items:
        $ref: '#/components/schemas/FleetIdOrArn'
      minItems: 1
    FleetIdOrArn:
      type: string
      pattern: ^fleet-\S+|^arn:.*:fleet\/fleet-\S+
    DescribeFleetUtilizationInput:
      type: object
      title: DescribeFleetUtilizationInput
      properties:
        FleetIds:
          allOf:
          - $ref: '#/components/schemas/FleetIdOrArnList'
          - description: 'A unique identifier for the fleet to retrieve utilization data for. You can use either the fleet ID or ARN value. To retrieve attributes for all current fleets, do not include this parameter. '
        Limit:
          allOf:
          - $ref: '#/components/schemas/PositiveInteger'
          - description: The maximum number of results to return. Use this parameter with <code>NextToken</code> to get results as a set of sequential pages. This parameter is ignored when the request specifies one or a list of fleet IDs.
        NextToken:
          allOf:
          - $ref: '#/components/schemas/NonZeroAndMaxString'
          - description: A token that indicates the start of the next sequential page of results. Use the token that is returned with a previous call to this operation. To start at the beginning of the result set, do not specify a value. This parameter is ignored when the request specifies one or a list of fleet IDs.
    FleetUtilization:
      type: object
      properties:
        FleetId:
          allOf:
          - $ref: '#/components/schemas/FleetId'
          - description: A unique identifier for the fleet associated with the location.
        FleetArn:
          allOf:
          - $ref: '#/components/schemas/FleetArn'
          - description: The Amazon Resource Name (<a href="https://docs.aws.amazon.com/AmazonS3/latest/dev/s3-arn-format.html">ARN</a>) that is assigned to a Amazon GameLift fleet resource and uniquely identifies it. ARNs are unique across all Regions. Format is <code>arn:aws:gamelift:&lt;region&gt;::fleet/fleet-a1234567-b8c9-0d1e-2fa3-b45c6d7e8912</code>.
        ActiveServerProcessCount:
          allOf:
          - $ref: '#/components/schemas/WholeNumber'
          - description: 'The number of server processes in <code>ACTIVE</code> status that are currently running across all instances in the fleet location. '
        ActiveGameSessionCount:
          allOf:
          - $ref: '#/components/schemas/WholeNumber'
          - description: The number of active game sessions that are currently being hosted across all instances in the fleet location.
        CurrentPlayerSessionCount:
          allOf:
          - $ref: '#/components/schemas/WholeNumber'
          - description: The number of active player sessions that are currently being hosted across all instances in the fleet location.
        MaximumPlayerSessionCount:
          allOf:
          - $ref: '#/components/schemas/WholeNumber'
          - description: The maximum number of players allowed across all game sessions that are currently being hosted across all instances in the fleet location.
        Location:
          allOf:
          - $ref: '#/components/schemas/LocationStringModel'
          - description: 'The fleet location for the fleet utilization information, expressed as an Amazon Web Services Region code, such as <code>us-west-2</code>. '
      description: <p>Current resource utilization statistics in a specified fleet or location. The location value might refer to a fleet's remote location or its home Region.</p> <p> <b>Related actions</b> </p>
    InvalidRequestException: {}
    NotFoundException: {}
    UnauthorizedException: {}
    LocationStringModel:
      type: string
      pattern: ^[A-Za-z0-9\-]+
      minLength: 1
      maxLength: 64
    PositiveInteger:
      type: integer
      minimum: 1
  parameters:
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
