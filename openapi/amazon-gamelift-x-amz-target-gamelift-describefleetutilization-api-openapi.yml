    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: DescribeFleetUtilization
      description: 'Retrieves utilization statistics for one or more fleets. Utilization data provides a snapshot of how the fleet''s hosting resources are currently being used. For fleets with remote locations, this operation retrieves data for the fleet''s home Region only. See DescribeFleetLocationUtilization to get utilization statistics for a fleet''s remote locations.


        This operation can be used in the following ways:


        To get utilization data for one or more specific fleets, provide a list of fleet IDs or fleet ARNs.


        To get utilization data for all fleets, do not provide a fleet identifier.


        When requesting multiple fleets, use the pagination parameters to retrieve results as a set of sequential pages.


        If successful, a FleetUtilization object is returned for each requested fleet ID, unless the fleet identifier is not found. Each fleet utilization object includes a Location property, which is set to the fleet''s home Region.


        Some API operations may limit the number of fleet IDs allowed in one request. If a request exceeds this limit, the request fails and the error message includes the maximum allowed.


        Learn more


        Setting up Amazon GameLift Fleets


        GameLift Metrics for Fleets'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescribeFleetUtilizationOutput'
              examples:
                DescribeFleetUtilization200Example:
                  summary: Default DescribeFleetUtilization 200 response
                  x-microcks-default: true
                  value:
                    FleetUtilization: example-value
                    NextToken: example-value
        '480':
          description: InternalServiceException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServiceException'
              examples:
                DescribeFleetUtilization480Example:
                  summary: Default DescribeFleetUtilization 480 response
                  x-microcks-default: true
                  value: example-value
        '481':
          description: NotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundException'
              examples:
                DescribeFleetUtilization481Example:
                  summary: Default DescribeFleetUtilization 481 response
                  x-microcks-default: true
                  value: example-value
        '482':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
              examples:
                DescribeFleetUtilization482Example:
                  summary: Default DescribeFleetUtilization 482 response
                  x-microcks-default: true
                  value: example-value
        '483':
          description: UnauthorizedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedException'
              examples:
                DescribeFleetUtilization483Example:
                  summary: Default DescribeFleetUtilization 483 response
                  x-microcks-default: true
                  value: example-value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescribeFleetUtilizationInput'
