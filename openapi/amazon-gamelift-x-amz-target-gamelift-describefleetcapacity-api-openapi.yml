  schemas:
    EC2InstanceCounts:
      type: object
      properties:
        DESIRED:
          allOf:
          - $ref: '#/components/schemas/WholeNumber'
          - description: 'Ideal number of active instances. GameLift will always try to maintain the desired number of instances. Capacity is scaled up or down by changing the desired instances. '
        MINIMUM:
          allOf:
          - $ref: '#/components/schemas/WholeNumber'
          - description: The minimum instance count value allowed.
        MAXIMUM:
          allOf:
          - $ref: '#/components/schemas/WholeNumber'
          - description: The maximum instance count value allowed.
        PENDING:
          allOf:
          - $ref: '#/components/schemas/WholeNumber'
          - description: Number of instances that are starting but not yet active.
        ACTIVE:
          allOf:
          - $ref: '#/components/schemas/WholeNumber'
          - description: Actual number of instances that are ready to host game sessions.
        IDLE:
          allOf:
          - $ref: '#/components/schemas/WholeNumber'
          - description: Number of active instances that are not currently hosting a game session.
        TERMINATING:
          allOf:
          - $ref: '#/components/schemas/WholeNumber'
          - description: Number of instances that are no longer active but haven't yet been terminated.
      description: Resource capacity settings. Fleet capacity is measured in Amazon EC2 instances. Pending and terminating counts are non-zero when the fleet capacity is adjusting to a scaling event or if access to resources is temporarily affected.
    FleetId:
      type: string
      pattern: ^fleet-\S+
    FleetCapacityList:
      type: array
      items:
        $ref: '#/components/schemas/FleetCapacity'
    InvalidRequestException: {}
    DescribeFleetCapacityOutput:
      type: object
      properties:
        FleetCapacity:
          allOf:
          - $ref: '#/components/schemas/FleetCapacityList'
          - description: A collection of objects that contains capacity information for each requested fleet ID. Capacity objects are returned only for fleets that currently exist.
        NextToken:
          allOf:
          - $ref: '#/components/schemas/NonZeroAndMaxString'
          - description: A token that indicates where to resume retrieving results on the next call to this operation. If no token is returned, these results represent the end of the list.
    FleetCapacity:
      type: object
      properties:
        FleetId:
          allOf:
          - $ref: '#/components/schemas/FleetId'
          - description: A unique identifier for the fleet associated with the location.
        FleetArn:
          allOf:
          - $ref: '#/components/schemas/FleetArn'
          - description: The Amazon Resource Name (<a href="https://docs.aws.amazon.com/AmazonS3/latest/dev/s3-arn-format.html">ARN</a>) that is assigned to a Amazon GameLift fleet resource and uniquely identifies it. ARNs are unique across all Regions. Format is <code>arn:aws:gamelift:&lt;region&gt;::fleet/fleet-a1234567-b8c9-0d1e-2fa3-b45c6d7e8912</code>.
        InstanceType:
          allOf:
          - $ref: '#/components/schemas/EC2InstanceType'
          - description: The Amazon EC2 instance type that is used for all instances in a fleet. The instance type determines the computing resources in use, including CPU, memory, storage, and networking capacity. See <a href="http://aws.amazon.com/ec2/instance-types/">Amazon Elastic Compute Cloud Instance Types</a> for detailed descriptions.
        InstanceCounts:
          $ref: '#/components/schemas/EC2InstanceCounts'
        Location:
          allOf:
          - $ref: '#/components/schemas/LocationStringModel'
          - description: 'The fleet location for the instance count information, expressed as an Amazon Web Services Region code, such as <code>us-west-2</code>. '
      description: <p>Current resource capacity settings in a specified fleet or location. The location value might refer to a fleet's remote location or its home Region. </p> <p> <b>Related actions</b> </p> <p> <a href="https://docs.aws.amazon.com/gamelift/latest/apireference/API_DescribeFleetCapacity.html">DescribeFleetCapacity</a> | <a href="https://docs.aws.amazon.com/gamelift/latest/apireference/API_DescribeFleetLocationCapacity.html">DescribeFleetLocationCapacity</a> | <a href="https://docs.aws.amazon.com/gamelift/latest/apireference/API_UpdateFleetCapacity.html">UpdateFleetCapacity</a> </p>
    PositiveInteger:
      type: integer
      minimum: 1
    UnauthorizedException: {}
    NotFoundException: {}
    FleetIdOrArnList:
      type: array
      items:
        $ref: '#/components/schemas/FleetIdOrArn'
      minItems: 1
