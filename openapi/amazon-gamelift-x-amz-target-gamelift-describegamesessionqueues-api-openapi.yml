    post:
      operationId: DescribeGameSessionQueues
      description: <p>Retrieves the properties for one or more game session queues. When requesting multiple queues, use the pagination parameters to retrieve results as a set of sequential pages. When specifying a list of queues, objects are returned only for queues that currently exist in the Region.</p> <p> <b>Learn more</b> </p> <p> <a href="https://docs.aws.amazon.com/gamelift/latest/developerguide/queues-console.html"> View Your Queues</a> </p>
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescribeGameSessionQueuesOutput'
              examples:
                DescribeGameSessionQueues200Example:
                  summary: Default DescribeGameSessionQueues 200 response
                  x-microcks-default: true
                  value:
                    GameSessionQueues: example-value
                    NextToken: example-value
        '480':
          description: InternalServiceException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServiceException'
              examples:
                DescribeGameSessionQueues480Example:
                  summary: Default DescribeGameSessionQueues 480 response
                  x-microcks-default: true
                  value: example-value
        '481':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
              examples:
                DescribeGameSessionQueues481Example:
                  summary: Default DescribeGameSessionQueues 481 response
                  x-microcks-default: true
                  value: example-value
        '482':
          description: NotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundException'
              examples:
                DescribeGameSessionQueues482Example:
                  summary: Default DescribeGameSessionQueues 482 response
                  x-microcks-default: true
                  value: example-value
        '483':
          description: UnauthorizedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedException'
              examples:
                DescribeGameSessionQueues483Example:
                  summary: Default DescribeGameSessionQueues 483 response
                  x-microcks-default: true
                  value: example-value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescribeGameSessionQueuesInput'
      parameters:
      - name: Limit
        in: query
