        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=GameLift.UpdateFleetPortSettings'
components:
  parameters:
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
  schemas:
    FleetId:
      type: string
      pattern: ^fleet-\S+
    LimitExceededException: {}
    InvalidRequestException: {}
    ConflictException: {}
    IpPermissionsList:
      type: array
      items:
        $ref: '#/components/schemas/IpPermission'
      maxItems: 50
    UpdateFleetPortSettingsOutput:
      type: object
      properties:
        FleetId:
          allOf:
          - $ref: '#/components/schemas/FleetId'
          - description: A unique identifier for the fleet that was updated.
        FleetArn:
          allOf:
          - $ref: '#/components/schemas/FleetArn'
          - description: The Amazon Resource Name (<a href="https://docs.aws.amazon.com/AmazonS3/latest/dev/s3-arn-format.html">ARN</a>) that is assigned to a Amazon GameLift fleet resource and uniquely identifies it. ARNs are unique across all Regions. Format is <code>arn:aws:gamelift:&lt;region&gt;::fleet/fleet-a1234567-b8c9-0d1e-2fa3-b45c6d7e8912</code>.
    UnauthorizedException: {}
    IpProtocol:
      type: string
      enum:
      - TCP
      - UDP
    IpPermission:
      type: object
      required:
      - FromPort
      - ToPort
      - IpRange
      - Protocol
      properties:
        FromPort:
          allOf:
          - $ref: '#/components/schemas/PortNumber'
          - description: <p>A starting value for a range of allowed port numbers.</p> <p>For fleets using Linux builds, only ports <code>22</code> and <code>1026-60000</code> are valid.</p> <p>For fleets using Windows builds, only ports <code>1026-60000</code> are valid.</p>
        ToPort:
          allOf:
          - $ref: '#/components/schemas/PortNumber'
          - description: <p>An ending value for a range of allowed port numbers. Port numbers are end-inclusive. This value must be equal to or greater than <code>FromPort</code>.</p> <p>For fleets using Linux builds, only ports <code>22</code> and <code>1026-60000</code> are valid.</p> <p>For fleets using Windows builds, only ports <code>1026-60000</code> are valid.</p>
        IpRange:
          allOf:
          - $ref: '#/components/schemas/NonBlankString'
          - description: 'A range of allowed IP addresses. This value must be expressed in CIDR notation. Example: "<code>000.000.000.000/[subnet mask]</code>" or optionally the shortened version "<code>0.0.0.0/[subnet mask]</code>".'
        Protocol:
          allOf:
          - $ref: '#/components/schemas/IpProtocol'
          - description: The network communication protocol used by the fleet.
      description: A range of IP addresses and port settings that allow inbound traffic to connect to server processes on an instance in a fleet. New game sessions are assigned an IP address/port number combination, which must fall into the fleet's allowed ranges. Fleets with custom game builds must have permissions explicitly set. For Realtime Servers fleets, Amazon GameLift automatically opens two port ranges, one for TCP messaging and one for UDP.
    NotFoundException: {}
    InternalServiceException: {}
    UpdateFleetPortSettingsInput:
      type: object
      required:
      - FleetId
      title: UpdateFleetPortSettingsInput
      properties:
        FleetId:
          allOf:
          - $ref: '#/components/schemas/FleetIdOrArn'
          - description: A unique identifier for the fleet to update port settings for. You can use either the fleet ID or ARN value.
        InboundPermissionAuthorizations:
          allOf:
          - $ref: '#/components/schemas/IpPermissionsList'
          - description: A collection of port settings to be added to the fleet resource.
        InboundPermissionRevocations:
          allOf:
          - $ref: '#/components/schemas/IpPermissionsList'
          - description: A collection of port settings to be removed from the fleet resource.
    InvalidFleetStatusException: {}
    NonBlankString:
      type: string
      pattern: '[^\s]+'
    PortNumber:
      type: integer
      minimum: 1
      maximum: 60000
    FleetArn:
      type: string
      pattern: ^arn:.*:fleet\/fleet-\S+
    FleetIdOrArn:
      type: string
      pattern: ^fleet-\S+|^arn:.*:fleet\/fleet-\S+
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
