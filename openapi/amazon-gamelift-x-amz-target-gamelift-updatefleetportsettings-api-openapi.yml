              examples:
                UpdateFleetPortSettings486Example:
                  summary: Default UpdateFleetPortSettings 486 response
                  x-microcks-default: true
                  value: example-value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFleetPortSettingsInput'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - GameLift.UpdateFleetPortSettings
      summary: Amazon GameLift Update Fleet Port Settings
