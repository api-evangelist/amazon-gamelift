tags:
- name: '#X Amz Target=GameLift.DescribeRuntimeConfiguration'
paths:
  /#X-Amz-Target=GameLift.DescribeRuntimeConfiguration:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: DescribeRuntimeConfiguration
      description: 'Retrieves a fleet''s runtime configuration settings. The runtime configuration tells Amazon GameLift which server processes to run (and how) on each instance in the fleet.


        To get the runtime configuration that is currently in forces for a fleet, provide the fleet ID.


        If successful, a RuntimeConfiguration object is returned for the requested fleet. If the requested fleet has been deleted, the result set is empty.


        Learn more


        Setting up Amazon GameLift fleets


        Running multiple processes on a fleet'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescribeRuntimeConfigurationOutput'
              examples:
                DescribeRuntimeConfiguration200Example:
                  summary: Default DescribeRuntimeConfiguration 200 response
                  x-microcks-default: true
                  value:
                    RuntimeConfiguration: example-value
        '480':
          description: UnauthorizedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedException'
              examples:
                DescribeRuntimeConfiguration480Example:
                  summary: Default DescribeRuntimeConfiguration 480 response
                  x-microcks-default: true
                  value: example-value
        '481':
          description: NotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundException'
              examples:
                DescribeRuntimeConfiguration481Example:
                  summary: Default DescribeRuntimeConfiguration 481 response
                  x-microcks-default: true
                  value: example-value
        '482':
          description: InternalServiceException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServiceException'
              examples:
                DescribeRuntimeConfiguration482Example:
                  summary: Default DescribeRuntimeConfiguration 482 response
                  x-microcks-default: true
                  value: example-value
        '483':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
              examples:
                DescribeRuntimeConfiguration483Example:
                  summary: Default DescribeRuntimeConfiguration 483 response
                  x-microcks-default: true
                  value: example-value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescribeRuntimeConfigurationInput'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - GameLift.DescribeRuntimeConfiguration
      summary: Amazon GameLift Describe Runtime Configuration
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=GameLift.DescribeRuntimeConfiguration'
components:
  schemas:
    LaunchParametersStringModel:
      type: string
      pattern: '[A-Za-z0-9_:.+\/\\\- =@;{},?''\[\]"]+'
      minLength: 1
      maxLength: 1024
    InvalidRequestException: {}
    DescribeRuntimeConfigurationInput:
      type: object
      required:
      - FleetId
      title: DescribeRuntimeConfigurationInput
      properties:
        FleetId:
          allOf:
          - $ref: '#/components/schemas/FleetIdOrArn'
          - description: A unique identifier for the fleet to get the runtime configuration for. You can use either the fleet ID or ARN value.
    MaxConcurrentGameSessionActivations:
      type: integer
      minimum: 1
      maximum: 2147483647
    NotFoundException: {}
    FleetIdOrArn:
      type: string
      pattern: ^fleet-\S+|^arn:.*:fleet\/fleet-\S+
    InternalServiceException: {}
    RuntimeConfiguration:
      type: object
      properties:
        ServerProcesses:
          allOf:
          - $ref: '#/components/schemas/ServerProcessList'
          - description: A collection of server process configurations that identify what server processes to run on each instance in a fleet.
        MaxConcurrentGameSessionActivations:
          allOf:
          - $ref: '#/components/schemas/MaxConcurrentGameSessionActivations'
          - description: The number of game sessions in status <code>ACTIVATING</code> to allow on an instance. This setting limits the instance resources that can be used for new game activations at any one time.
        GameSessionActivationTimeoutSeconds:
          allOf:
          - $ref: '#/components/schemas/GameSessionActivationTimeoutSeconds'
          - description: The maximum amount of time (in seconds) allowed to launch a new game session and have it report ready to host players. During this time, the game session is in status <code>ACTIVATING</code>. If the game session does not become active before the timeout, it is ended and the game session status is changed to <code>TERMINATED</code>.
      description: <p>A collection of server process configurations that describe the set of processes to run on each instance in a fleet. Server processes run either an executable in a custom game build or a Realtime Servers script. Amazon GameLift launches the configured processes, manages their life cycle, and replaces them as needed. Each instance checks regularly for an updated runtime configuration. </p> <p>A Amazon GameLift instance is limited to 50 processes running concurrently. To calculate the total number of processes in a runtime configuration, add the values of the <code>ConcurrentExecutions</code> parameter for each server process. Learn more about <a href="https://docs.aws.amazon.com/gamelift/latest/developerguide/fleets-multiprocess.html"> Running Multiple Processes on a Fleet</a>.</p>
    ServerProcessList:
      type: array
      items:
        $ref: '#/components/schemas/ServerProcess'
      minItems: 1
      maxItems: 50
    PositiveInteger:
      type: integer
      minimum: 1
    ServerProcess:
      type: object
      required:
      - LaunchPath
      - ConcurrentExecutions
      properties:
        LaunchPath:
          allOf:
          - $ref: '#/components/schemas/LaunchPathStringModel'
          - description: '<p>The location of a game build executable or the Realtime script file that contains the <code>Init()</code> function. Game builds and Realtime scripts are installed on instances at the root: </p> <ul> <li> <p>Windows (custom game builds only): <code>C:\game</code>. Example: "<code>C:\game\MyGame\server.exe</code>" </p> </li> <li> <p>Linux: <code>/local/game</code>. Examples: "<code>/local/game/MyGame/server.exe</code>" or "<code>/local/game/MyRealtimeScript.js</code>"</p> </li> </ul>'
        Parameters:
          allOf:
          - $ref: '#/components/schemas/LaunchParametersStringModel'
          - description: An optional list of parameters to pass to the server executable or Realtime script on launch.
        ConcurrentExecutions:
          allOf:
          - $ref: '#/components/schemas/PositiveInteger'
          - description: The number of server processes using this configuration that run concurrently on each instance.
      description: A set of instructions for launching server processes on each instance in a fleet. Server processes run either an executable in a custom game build or a Realtime Servers script. Server process configurations are part of a fleet's runtime configuration.
    LaunchPathStringModel:
      type: string
      pattern: '[A-Za-z0-9_:.+\/\\\- ]+'
      minLength: 1
      maxLength: 1024
    UnauthorizedException: {}
    DescribeRuntimeConfigurationOutput:
      type: object
      properties:
        RuntimeConfiguration:
          allOf:
          - $ref: '#/components/schemas/RuntimeConfiguration'
          - description: Instructions that describe how server processes should be launched and maintained on each instance in the fleet.
    GameSessionActivationTimeoutSeconds:
      type: integer
      minimum: 1
      maximum: 600
  parameters:
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
