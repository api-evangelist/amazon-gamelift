          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteVpcPeeringConnectionOutput'
              examples:
                DeleteVpcPeeringConnection200Example:
                  summary: Default DeleteVpcPeeringConnection 200 response
                  x-microcks-default: true
                  value: {}
        '480':
