          type: string
          enum:
          - GameLift.StopFleetActions
      summary: Amazon GameLift Stop Fleet Actions
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=GameLift.StopFleetActions'
components:
  schemas:
    FleetId:
      type: string
      pattern: ^fleet-\S+
    InternalServiceException: {}
    FleetActionList:
      type: array
      items:
        $ref: '#/components/schemas/FleetAction'
      minItems: 1
      maxItems: 1
    FleetAction:
      type: string
      enum:
      - AUTO_SCALING
    FleetArn:
      type: string
      pattern: ^arn:.*:fleet\/fleet-\S+
    FleetIdOrArn:
      type: string
      pattern: ^fleet-\S+|^arn:.*:fleet\/fleet-\S+
    StopFleetActionsOutput:
      type: object
      properties:
        FleetId:
          allOf:
          - $ref: '#/components/schemas/FleetId'
          - description: A unique identifier for the fleet to stop actions on.
        FleetArn:
          allOf:
          - $ref: '#/components/schemas/FleetArn'
          - description: The Amazon Resource Name (<a href="https://docs.aws.amazon.com/AmazonS3/latest/dev/s3-arn-format.html">ARN</a>) that is assigned to a Amazon GameLift fleet resource and uniquely identifies it. ARNs are unique across all Regions. Format is <code>arn:aws:gamelift:&lt;region&gt;::fleet/fleet-a1234567-b8c9-0d1e-2fa3-b45c6d7e8912</code>.
    InvalidRequestException: {}
    NotFoundException: {}
    StopFleetActionsInput:
      type: object
      required:
      - FleetId
      - Actions
      title: StopFleetActionsInput
      properties:
        FleetId:
          allOf:
          - $ref: '#/components/schemas/FleetIdOrArn'
          - description: A unique identifier for the fleet to stop actions on. You can use either the fleet ID or ARN value.
        Actions:
          allOf:
          - $ref: '#/components/schemas/FleetActionList'
          - description: 'List of actions to suspend on the fleet. '
        Location:
          allOf:
          - $ref: '#/components/schemas/LocationStringModel'
          - description: The fleet location to stop fleet actions for. Specify a location in the form of an Amazon Web Services Region code, such as <code>us-west-2</code>.
    UnauthorizedException: {}
    LocationStringModel:
      type: string
      pattern: ^[A-Za-z0-9\-]+
      minLength: 1
      maxLength: 64
    UnsupportedRegionException: {}
  parameters:
    X-Amz-Date:
