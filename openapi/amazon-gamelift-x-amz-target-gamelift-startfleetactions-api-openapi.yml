tags:
- name: '#X Amz Target=GameLift.StartFleetActions'
paths:
  /#X-Amz-Target=GameLift.StartFleetActions:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: StartFleetActions
      description: 'Resumes certain types of activity on fleet instances that were suspended with StopFleetActions. For multi-location fleets, fleet actions are managed separately for each location. Currently, this operation is used to restart a fleet''s auto-scaling activity.


        This operation can be used in the following ways:


        To restart actions on instances in the fleet''s home Region, provide a fleet ID and the type of actions to resume.


        To restart actions on instances in one of the fleet''s remote locations, provide a fleet ID, a location name, and the type of actions to resume.


        If successful, Amazon GameLift once again initiates scaling events as triggered by the fleet''s scaling policies. If actions on the fleet location were never stopped, this operation will have no effect.


        Learn more


        Setting up Amazon GameLift fleets'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartFleetActionsOutput'
              examples:
                StartFleetActions200Example:
                  summary: Default StartFleetActions 200 response
                  x-microcks-default: true
                  value:
                    FleetId: fleet-1a2b3c4d-5678-90ab-cdef-1234567890ab
                    FleetArn: arn:aws:gamelift:us-east-1:123456789012:fleet/fleet-1a2b3c4d
        '480':
          description: InternalServiceException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServiceException'
              examples:
                StartFleetActions480Example:
                  summary: Default StartFleetActions 480 response
                  x-microcks-default: true
                  value: example-value
        '481':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
              examples:
                StartFleetActions481Example:
                  summary: Default StartFleetActions 481 response
                  x-microcks-default: true
                  value: example-value
        '482':
          description: UnauthorizedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedException'
              examples:
                StartFleetActions482Example:
                  summary: Default StartFleetActions 482 response
                  x-microcks-default: true
                  value: example-value
        '483':
          description: NotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundException'
              examples:
                StartFleetActions483Example:
                  summary: Default StartFleetActions 483 response
                  x-microcks-default: true
                  value: example-value
        '484':
          description: UnsupportedRegionException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsupportedRegionException'
              examples:
                StartFleetActions484Example:
                  summary: Default StartFleetActions 484 response
                  x-microcks-default: true
                  value: example-value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartFleetActionsInput'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - GameLift.StartFleetActions
      summary: Amazon GameLift Start Fleet Actions
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=GameLift.StartFleetActions'
components:
  schemas:
    StartFleetActionsInput:
      type: object
      required:
      - FleetId
      - Actions
      title: StartFleetActionsInput
      properties:
        FleetId:
          allOf:
          - $ref: '#/components/schemas/FleetIdOrArn'
          - description: A unique identifier for the fleet to restart actions on. You can use either the fleet ID or ARN value.
        Actions:
          allOf:
          - $ref: '#/components/schemas/FleetActionList'
          - description: List of actions to restart on the fleet.
        Location:
          allOf:
          - $ref: '#/components/schemas/LocationStringModel'
          - description: The fleet location to restart fleet actions for. Specify a location in the form of an Amazon Web Services Region code, such as <code>us-west-2</code>.
    LocationStringModel:
      type: string
      pattern: ^[A-Za-z0-9\-]+
      minLength: 1
      maxLength: 64
    FleetActionList:
      type: array
      items:
        $ref: '#/components/schemas/FleetAction'
      minItems: 1
      maxItems: 1
    InvalidRequestException: {}
    FleetId:
      type: string
      pattern: ^fleet-\S+
    UnsupportedRegionException: {}
    NotFoundException: {}
    StartFleetActionsOutput:
      type: object
      properties:
        FleetId:
          allOf:
          - $ref: '#/components/schemas/FleetId'
          - description: A unique identifier for the fleet to restart actions on.
        FleetArn:
          allOf:
          - $ref: '#/components/schemas/FleetArn'
          - description: The Amazon Resource Name (<a href="https://docs.aws.amazon.com/AmazonS3/latest/dev/s3-arn-format.html">ARN</a>) that is assigned to a Amazon GameLift fleet resource and uniquely identifies it. ARNs are unique across all Regions. Format is <code>arn:aws:gamelift:&lt;region&gt;::fleet/fleet-a1234567-b8c9-0d1e-2fa3-b45c6d7e8912</code>.
    FleetIdOrArn:
      type: string
      pattern: ^fleet-\S+|^arn:.*:fleet\/fleet-\S+
    FleetAction:
      type: string
      enum:
      - AUTO_SCALING
    InternalServiceException: {}
    FleetArn:
      type: string
      pattern: ^arn:.*:fleet\/fleet-\S+
    UnauthorizedException: {}
  parameters:
    X-Amz-Content-Sha256:
