                  summary: Default CreateFleetLocations 483 response
                  x-microcks-default: true
                  value: example-value
        '484':
          description: InvalidFleetStatusException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidFleetStatusException'
              examples:
                CreateFleetLocations484Example:
                  summary: Default CreateFleetLocations 484 response
                  x-microcks-default: true
