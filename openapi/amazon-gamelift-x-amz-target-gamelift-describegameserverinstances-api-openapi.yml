components:
  schemas:
    GameServerInstanceId:
      type: string
      pattern: ^i-[0-9a-zA-Z]{17}$
      minLength: 19
      maxLength: 19
    GameServerInstanceIds:
      type: array
      items:
        $ref: '#/components/schemas/GameServerInstanceId'
      minItems: 1
      maxItems: 20
    InvalidRequestException: {}
    NotFoundException: {}
    GameServerGroupName:
      type: string
      pattern: '[a-zA-Z0-9-\.]+'
      minLength: 1
      maxLength: 128
    NonZeroAndMaxString:
      type: string
      minLength: 1
      maxLength: 1024
    GameServerGroupArn:
      type: string
      pattern: ^arn:.*:gameservergroup\/[a-zA-Z0-9-\.]*
      minLength: 1
      maxLength: 256
    GameServerInstances:
      type: array
      items:
        $ref: '#/components/schemas/GameServerInstance'
    DescribeGameServerInstancesInput:
      type: object
      required:
      - GameServerGroupName
      title: DescribeGameServerInstancesInput
      properties:
        GameServerGroupName:
          allOf:
          - $ref: '#/components/schemas/GameServerGroupNameOrArn'
          - description: A unique identifier for the game server group. Use either the name or ARN value.
        InstanceIds:
          allOf:
          - $ref: '#/components/schemas/GameServerInstanceIds'
          - description: 'The Amazon EC2 instance IDs that you want to retrieve status on. Amazon EC2 instance IDs use a 17-character format, for example: <code>i-1234567890abcdef0</code>. To retrieve all instances in the game server group, leave this parameter empty. '
        Limit:
          allOf:
          - $ref: '#/components/schemas/PositiveInteger'
          - description: The maximum number of results to return. Use this parameter with <code>NextToken</code> to get results as a set of sequential pages.
        NextToken:
          allOf:
          - $ref: '#/components/schemas/NonZeroAndMaxString'
          - description: A token that indicates the start of the next sequential page of results. Use the token that is returned with a previous call to this operation. To start at the beginning of the result set, do not specify a value.
    InternalServiceException: {}
    PositiveInteger:
      type: integer
      minimum: 1
    GameServerInstance:
      type: object
      properties:
        GameServerGroupName:
          allOf:
          - $ref: '#/components/schemas/GameServerGroupName'
          - description: A developer-defined identifier for the game server group that includes the game server instance. The name is unique for each Region in each Amazon Web Services account.
        GameServerGroupArn:
          allOf:
          - $ref: '#/components/schemas/GameServerGroupArn'
          - description: 'A generated unique identifier for the game server group that includes the game server instance. '
        InstanceId:
          allOf:
          - $ref: '#/components/schemas/GameServerInstanceId'
          - description: 'The unique identifier for the instance where the game server is running. This ID is available in the instance metadata. EC2 instance IDs use a 17-character format, for example: <code>i-1234567890abcdef0</code>.'
        InstanceStatus:
          allOf:
          - $ref: '#/components/schemas/GameServerInstanceStatus'
          - description: Current status of the game server instance
      description: <p> <b>This data type is used with the Amazon GameLift FleetIQ and game server groups.</b> </p> <p> Additional properties, including status, that describe an EC2 instance in a game server group. Instance configurations are set with game server group properties (see <code>DescribeGameServerGroup</code> and with the EC2 launch template that was used when creating the game server group. </p> <p>Retrieve game server instances for a game server group by calling <code>DescribeGameServerInstances</code>. </p>
    DescribeGameServerInstancesOutput:
      type: object
      properties:
        GameServerInstances:
          allOf:
          - $ref: '#/components/schemas/GameServerInstances'
          - description: The collection of requested game server instances.
        NextToken:
          allOf:
          - $ref: '#/components/schemas/NonZeroAndMaxString'
          - description: A token that indicates where to resume retrieving results on the next call to this operation. If no token is returned, these results represent the end of the list.
    GameServerGroupNameOrArn:
      type: string
      pattern: '[a-zA-Z0-9-\.]+|^arn:.*:gameservergroup\/[a-zA-Z0-9-\.]+'
      minLength: 1
      maxLength: 256
    UnauthorizedException: {}
    GameServerInstanceStatus:
      type: string
      enum:
      - ACTIVE
      - DRAINING
      - SPOT_TERMINATING
  parameters:
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
