paths:
  /#X-Amz-Target=GameLift.ClaimGameServer:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: ClaimGameServer
      description: <p> <b>This operation is used with the Amazon GameLift FleetIQ solution and game server groups.</b> </p> <p>Locates an available game server and temporarily reserves it to host gameplay and players. This operation is called from a game client or client service (such as a matchmaker) to request hosting resources for a new game session. In response, Amazon GameLift FleetIQ locates an available game server, places it in <code>CLAIMED</code> status for 60 seconds, and returns connection information that players can use to connect to the game server. </p> <p>To claim a game server, identify a game server group. You can also specify a game server ID, although this approach bypasses Amazon GameLift FleetIQ placement optimization. Optionally, include game data to pass to the game server at the start of a game session, such as a game map or player information. </p> <p>When a game server is successfully claimed, connection information is returned. A claimed game server's utilization status remains <code>AVAILABLE</code> while the claim status is set to <code>CLAIMED</code> for up to 60 seconds. This time period gives the game server time to update its status to <code>UTILIZED</code> after players join. If the game server's status is not updated within 60 seconds, the game server reverts to unclaimed status and is available to be claimed by another request. The claim time period is a fixed value and is not configurable.</p> <p>If you try to claim a specific game server, this request will fail in the following cases:</p> <ul> <li> <p>If the game server utilization status is <code>UTILIZED</code>.</p> </li> <li> <p>If the game server claim status is <code>CLAIMED</code>.</p> </li> </ul> <note> <p>When claiming a specific game server, this request will succeed even if the game server is running on an instance in <code>DRAINING</code> status. To avoid this, first check the instance status by calling <a href="https://docs.aws.amazon.com/gamelift/latest/apireference/API_DescribeGameServerInstances.html">DescribeGameServerInstances</a> .</p> </note> <p> <b>Learn more</b> </p> <p> <a href="https://docs.aws.amazon.com/gamelift/latest/fleetiqguide/gsg-intro.html">Amazon GameLift FleetIQ Guide</a> </p>
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimGameServerOutput'
              examples:
                ClaimGameServer200Example:
                  summary: Default ClaimGameServer 200 response
                  x-microcks-default: true
                  value:
                    GameServer: example-value
        '480':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
              examples:
                ClaimGameServer480Example:
                  summary: Default ClaimGameServer 480 response
                  x-microcks-default: true
                  value: example-value
        '481':
          description: NotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundException'
              examples:
                ClaimGameServer481Example:
                  summary: Default ClaimGameServer 481 response
                  x-microcks-default: true
                  value: example-value
        '482':
          description: ConflictException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictException'
              examples:
                ClaimGameServer482Example:
                  summary: Default ClaimGameServer 482 response
                  x-microcks-default: true
                  value: example-value
        '483':
          description: OutOfCapacityException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutOfCapacityException'
              examples:
                ClaimGameServer483Example:
                  summary: Default ClaimGameServer 483 response
                  x-microcks-default: true
                  value: example-value
        '484':
          description: UnauthorizedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedException'
              examples:
                ClaimGameServer484Example:
                  summary: Default ClaimGameServer 484 response
                  x-microcks-default: true
                  value: example-value
        '485':
          description: InternalServiceException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServiceException'
              examples:
                ClaimGameServer485Example:
                  summary: Default ClaimGameServer 485 response
                  x-microcks-default: true
                  value: example-value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimGameServerInput'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - GameLift.ClaimGameServer
      summary: Amazon GameLift Claim Game Server
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=GameLift.ClaimGameServer'
components:
  schemas:
    ConflictException: {}
    GameServerGroupNameOrArn:
      type: string
      pattern: '[a-zA-Z0-9-\.]+|^arn:.*:gameservergroup\/[a-zA-Z0-9-\.]+'
      minLength: 1
      maxLength: 256
    InternalServiceException: {}
    GameServerGroupArn:
      type: string
      pattern: ^arn:.*:gameservergroup\/[a-zA-Z0-9-\.]*
      minLength: 1
      maxLength: 256
    GameServerId:
      type: string
      pattern: '[a-zA-Z0-9-\.]+'
      minLength: 3
      maxLength: 128
    GameServerGroupName:
      type: string
      pattern: '[a-zA-Z0-9-\.]+'
      minLength: 1
      maxLength: 128
    GameServerClaimStatus:
      type: string
      enum:
      - CLAIMED
    GameServerInstanceId:
      type: string
      pattern: ^i-[0-9a-zA-Z]{17}$
      minLength: 19
      maxLength: 19
    GameServer:
      type: object
      properties:
        GameServerGroupName:
          allOf:
          - $ref: '#/components/schemas/GameServerGroupName'
          - description: A unique identifier for the game server group where the game server is running.
        GameServerGroupArn:
          allOf:
          - $ref: '#/components/schemas/GameServerGroupArn'
          - description: The ARN identifier for the game server group where the game server is located.
        GameServerId:
          allOf:
          - $ref: '#/components/schemas/GameServerId'
          - description: A custom string that uniquely identifies the game server. Game server IDs are developer-defined and are unique across all game server groups in an Amazon Web Services account.
        InstanceId:
          allOf:
          - $ref: '#/components/schemas/GameServerInstanceId'
          - description: 'The unique identifier for the instance where the game server is running. This ID is available in the instance metadata. EC2 instance IDs use a 17-character format, for example: <code>i-1234567890abcdef0</code>.'
        ConnectionInfo:
          allOf:
          - $ref: '#/components/schemas/GameServerConnectionInfo'
          - description: The port and IP address that must be used to establish a client connection to the game server.
        GameServerData:
          allOf:
          - $ref: '#/components/schemas/GameServerData'
          - description: A set of custom game server properties, formatted as a single string value. This data is passed to a game client or service when it requests information on game servers.
        ClaimStatus:
          allOf:
          - $ref: '#/components/schemas/GameServerClaimStatus'
          - description: Indicates when an available game server has been reserved for gameplay but has not yet started hosting a game. Once it is claimed, the game server remains in <code>CLAIMED</code> status for a maximum of one minute. During this time, game clients connect to the game server to start the game and trigger the game server to update its utilization status. After one minute, the game server claim status reverts to null.
        UtilizationStatus:
          allOf:
          - $ref: '#/components/schemas/GameServerUtilizationStatus'
          - description: <p>Indicates whether the game server is currently available for new games or is busy. Possible statuses include:</p> <ul> <li> <p> <code>AVAILABLE</code> - The game server is available to be claimed. A game server that has been claimed remains in this status until it reports game hosting activity. </p> </li> <li> <p> <code>UTILIZED</code> - The game server is currently hosting a game session with players. </p> </li> </ul>
        RegistrationTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: Timestamp that indicates when the game server registered. The format is a number expressed in Unix time as milliseconds (for example <code>"1469498468.057"</code>).
        LastClaimTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: Timestamp that indicates the last time the game server was claimed. The format is a number expressed in Unix time as milliseconds (for example <code>"1469498468.057"</code>). This value is used to calculate when a claimed game server's status should revert to null.
        LastHealthCheckTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: Timestamp that indicates the last time the game server was updated with health status. The format is a number expressed in Unix time as milliseconds (for example <code>"1469498468.057"</code>). After game server registration, this property is only changed when a game server update specifies a health check value.
      description: <p> <b>This data type is used with the Amazon GameLift FleetIQ and game server groups.</b> </p> <p>Properties describing a game server that is running on an instance in a game server group. </p> <p>A game server is created by a successful call to <code>RegisterGameServer</code> and deleted by calling <code>DeregisterGameServer</code>. A game server is claimed to host a game session by calling <code>ClaimGameServer</code>. </p>
    ClaimGameServerInput:
      type: object
      required:
      - GameServerGroupName
      title: ClaimGameServerInput
      properties:
        GameServerGroupName:
          allOf:
          - $ref: '#/components/schemas/GameServerGroupNameOrArn'
          - description: 'A unique identifier for the game server group where the game server is running. If you are not specifying a game server to claim, this value identifies where you want Amazon GameLift FleetIQ to look for an available game server to claim. '
        GameServerId:
          allOf:
          - $ref: '#/components/schemas/GameServerId'
          - description: A custom string that uniquely identifies the game server to claim. If this parameter is left empty, Amazon GameLift FleetIQ searches for an available game server in the specified game server group.
        GameServerData:
          allOf:
          - $ref: '#/components/schemas/GameServerData'
          - description: 'A set of custom game server properties, formatted as a single string value. This data is passed to a game client or service when it requests information on game servers. '
    InvalidRequestException: {}
    NotFoundException: {}
    GameServerData:
      type: string
      pattern: .*\S.*
      minLength: 1
      maxLength: 1024
    UnauthorizedException: {}
    Timestamp:
      type: string
      format: date-time
    ClaimGameServerOutput:
      type: object
      properties:
        GameServer:
          allOf:
          - $ref: '#/components/schemas/GameServer'
          - description: Object that describes the newly claimed game server.
    OutOfCapacityException: {}
    GameServerUtilizationStatus:
      type: string
      enum:
      - AVAILABLE
      - UTILIZED
    GameServerConnectionInfo:
      type: string
      pattern: .*\S.*
      minLength: 1
      maxLength: 512
  parameters:
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
