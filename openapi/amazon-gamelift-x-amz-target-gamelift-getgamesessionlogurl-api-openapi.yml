paths:
  /#X-Amz-Target=GameLift.GetGameSessionLogUrl:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: GetGameSessionLogUrl
      description: 'Retrieves the location of stored game session logs for a specified game session. When a game session is terminated, Amazon GameLift automatically stores the logs in Amazon S3 and retains them for 14 days. Use this URL to download the logs.


        See the Amazon Web Services Service Limits page for maximum log file sizes. Log files that exceed this limit are not saved.


        All APIs by task'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetGameSessionLogUrlOutput'
              examples:
                GetGameSessionLogUrl200Example:
                  summary: Default GetGameSessionLogUrl 200 response
                  x-microcks-default: true
                  value:
                    PreSignedUrl: example-value
        '480':
          description: InternalServiceException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServiceException'
              examples:
                GetGameSessionLogUrl480Example:
                  summary: Default GetGameSessionLogUrl 480 response
                  x-microcks-default: true
                  value: example-value
        '481':
          description: NotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundException'
              examples:
                GetGameSessionLogUrl481Example:
                  summary: Default GetGameSessionLogUrl 481 response
                  x-microcks-default: true
                  value: example-value
        '482':
          description: UnauthorizedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedException'
              examples:
                GetGameSessionLogUrl482Example:
                  summary: Default GetGameSessionLogUrl 482 response
                  x-microcks-default: true
                  value: example-value
        '483':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
              examples:
                GetGameSessionLogUrl483Example:
                  summary: Default GetGameSessionLogUrl 483 response
                  x-microcks-default: true
                  value: example-value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetGameSessionLogUrlInput'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - GameLift.GetGameSessionLogUrl
      summary: Amazon GameLift Get Game Session Log Url
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=GameLift.GetGameSessionLogUrl'
components:
  parameters:
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
