      title: GetGameSessionLogUrlInput
      properties:
        GameSessionId:
          allOf:
          - $ref: '#/components/schemas/ArnStringModel'
          - description: 'A unique identifier for the game session to get logs for. '
    ArnStringModel:
      type: string
      pattern: '[a-zA-Z0-9:/-]+'
      minLength: 1
      maxLength: 256
    NotFoundException: {}
    InvalidRequestException: {}
    NonZeroAndMaxString:
      type: string
      minLength: 1
      maxLength: 1024
    UnauthorizedException: {}
    GetGameSessionLogUrlOutput:
      type: object
      properties:
        PreSignedUrl:
          allOf:
          - $ref: '#/components/schemas/NonZeroAndMaxString'
          - description: Location of the requested game session logs, available for download. This URL is valid for 15 minutes, after which S3 will reject any download request using this URL. You can request a new URL any time within the 14-day period that the logs are retained.
    InternalServiceException: {}
  securitySchemes:
