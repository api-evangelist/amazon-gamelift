- name: '#X Amz Target=GameLift.ListAliases'
paths:
  /#X-Amz-Target=GameLift.ListAliases:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: ListAliases
      description: <p>Retrieves all aliases for this Amazon Web Services account. You can filter the result set by alias name and/or routing strategy type. Use the pagination parameters to retrieve results in sequential pages.</p> <note> <p>Returned aliases are not listed in any particular order.</p> </note> <p> <b>Related actions</b> </p> <p> <a href="https://docs.aws.amazon.com/gamelift/latest/developerguide/reference-awssdk.html#reference-awssdk-resources-fleets">All APIs by task</a> </p>
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAliasesOutput'
              examples:
                ListAliases200Example:
                  summary: Default ListAliases 200 response
                  x-microcks-default: true
                  value:
                    Aliases: example-value
                    NextToken: example-value
        '480':
          description: UnauthorizedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedException'
              examples:
                ListAliases480Example:
                  summary: Default ListAliases 480 response
                  x-microcks-default: true
                  value: example-value
        '481':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
              examples:
                ListAliases481Example:
                  summary: Default ListAliases 481 response
                  x-microcks-default: true
                  value: example-value
        '482':
          description: InternalServiceException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServiceException'
              examples:
                ListAliases482Example:
                  summary: Default ListAliases 482 response
                  x-microcks-default: true
                  value: example-value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListAliasesInput'
      parameters:
      - name: Limit
        in: query
        schema:
          type: string
        description: Pagination limit
        required: false
      - name: NextToken
        in: query
        schema:
          type: string
        description: Pagination token
        required: false
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - GameLift.ListAliases
      summary: Amazon GameLift List Aliases
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=GameLift.ListAliases'
components:
  schemas:
    FleetId:
      type: string
      pattern: ^fleet-\S+
    AliasList:
      type: array
      items:
        $ref: '#/components/schemas/Alias'
    FreeText:
      type: string
    InternalServiceException: {}
    ListAliasesOutput:
      type: object
      properties:
        Aliases:
          allOf:
          - $ref: '#/components/schemas/AliasList'
          - description: A collection of alias resources that match the request parameters.
        NextToken:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          - description: A token that indicates where to resume retrieving results on the next call to this operation. If no token is returned, these results represent the end of the list.
    ListAliasesInput:
      type: object
      title: ListAliasesInput
      properties:
        RoutingStrategyType:
          allOf:
          - $ref: '#/components/schemas/RoutingStrategyType'
          - description: <p>The routing type to filter results on. Use this parameter to retrieve only aliases with a certain routing type. To retrieve all aliases, leave this parameter empty.</p> <p>Possible routing types include the following:</p> <ul> <li> <p> <b>SIMPLE</b> -- The alias resolves to one specific fleet. Use this type when routing to active fleets.</p> </li> <li> <p> <b>TERMINAL</b> -- The alias does not resolve to a fleet but instead can be used to display a message to the user. A terminal alias throws a TerminalRoutingStrategyException with the <a href="https://docs.aws.amazon.com/gamelift/latest/apireference/API_RoutingStrategy.html">RoutingStrategy</a> message embedded.</p> </li> </ul>
        Name:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          - description: A descriptive label that is associated with an alias. Alias names do not need to be unique.
        Limit:
          allOf:
          - $ref: '#/components/schemas/PositiveInteger'
          - description: The maximum number of results to return. Use this parameter with <code>NextToken</code> to get results as a set of sequential pages.
        NextToken:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          - description: A token that indicates the start of the next sequential page of results. Use the token that is returned with a previous call to this operation. To start at the beginning of the result set, do not specify a value.
    Alias:
      type: object
      properties:
        AliasId:
          allOf:
          - $ref: '#/components/schemas/AliasId'
          - description: A unique identifier for the alias. Alias IDs are unique within a Region.
        Name:
          allOf:
          - $ref: '#/components/schemas/NonBlankAndLengthConstraintString'
          - description: A descriptive label that is associated with an alias. Alias names do not need to be unique.
        AliasArn:
          allOf:
          - $ref: '#/components/schemas/AliasArn'
          - description: The Amazon Resource Name (<a href="https://docs.aws.amazon.com/AmazonS3/latest/dev/s3-arn-format.html">ARN</a>) that is assigned to a Amazon GameLift alias resource and uniquely identifies it. ARNs are unique across all Regions. Format is <code>arn:aws:gamelift:&lt;region&gt;::alias/alias-a1234567-b8c9-0d1e-2fa3-b45c6d7e8912</code>. In a GameLift alias ARN, the resource ID matches the alias ID value.
        Description:
          allOf:
          - $ref: '#/components/schemas/FreeText'
          - description: A human-readable description of an alias.
        RoutingStrategy:
          allOf:
          - $ref: '#/components/schemas/RoutingStrategy'
          - description: 'The routing configuration, including routing type and fleet target, for the alias. '
        CreationTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: A time stamp indicating when this data object was created. Format is a number expressed in Unix time as milliseconds (for example <code>"1469498468.057"</code>).
        LastUpdatedTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: The time that this data object was last modified. Format is a number expressed in Unix time as milliseconds (for example <code>"1469498468.057"</code>).
      description: <p>Properties that describe an alias resource.</p> <p> <b>Related actions</b> </p> <p> <a href="https://docs.aws.amazon.com/gamelift/latest/developerguide/reference-awssdk.html#reference-awssdk-resources-fleets">All APIs by task</a> </p>
    AliasArn:
      type: string
      pattern: ^arn:.*:alias\/alias-\S+
    InvalidRequestException: {}
    AliasId:
      type: string
      pattern: ^alias-\S+
    UnauthorizedException: {}
    Timestamp:
      type: string
      format: date-time
    PositiveInteger:
      type: integer
      minimum: 1
    RoutingStrategy:
      type: object
      properties:
        Type:
          allOf:
          - $ref: '#/components/schemas/RoutingStrategyType'
          - description: <p>The type of routing strategy for the alias.</p> <p>Possible routing types include the following:</p> <ul> <li> <p> <b>SIMPLE</b> - The alias resolves to one specific fleet. Use this type when routing to active fleets.</p> </li> <li> <p> <b>TERMINAL</b> - The alias does not resolve to a fleet but instead can be used to display a message to the user. A terminal alias throws a TerminalRoutingStrategyException with the message embedded.</p> </li> </ul>
        FleetId:
          allOf:
          - $ref: '#/components/schemas/FleetId'
          - description: A unique identifier for the fleet that the alias points to. This value is the fleet ID, not the fleet ARN.
        Message:
          allOf:
          - $ref: '#/components/schemas/FreeText'
          - description: The message text to be used with a terminal routing strategy.
      description: <p>The routing configuration for a fleet alias.</p> <p> <b>Related actions</b> </p> <p> <a href="https://docs.aws.amazon.com/gamelift/latest/developerguide/reference-awssdk.html#reference-awssdk-resources-fleets">All APIs by task</a> </p>
    RoutingStrategyType:
      type: string
      enum:
      - SIMPLE
      - TERMINAL
    NonBlankAndLengthConstraintString:
      type: string
      pattern: .*\S.*
      minLength: 1
      maxLength: 1024
    NonEmptyString:
      type: string
      minLength: 1
  parameters:
    X-Amz-Date:
      name: X-Amz-Date
      in: header
