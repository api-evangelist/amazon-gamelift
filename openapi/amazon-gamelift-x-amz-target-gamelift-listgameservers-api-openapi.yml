paths:
  /#X-Amz-Target=GameLift.ListGameServers:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: ListGameServers
      description: <p> <b>This operation is used with the Amazon GameLift FleetIQ solution and game server groups.</b> </p> <p>Retrieves information on all game servers that are currently active in a specified game server group. You can opt to sort the list by game server age. Use the pagination parameters to retrieve results in a set of sequential segments. </p> <p> <b>Learn more</b> </p> <p> <a href="https://docs.aws.amazon.com/gamelift/latest/fleetiqguide/gsg-intro.html">Amazon GameLift FleetIQ Guide</a> </p>
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListGameServersOutput'
              examples:
                ListGameServers200Example:
                  summary: Default ListGameServers 200 response
                  x-microcks-default: true
                  value:
                    GameServers: example-value
                    NextToken: example-value
        '480':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
              examples:
                ListGameServers480Example:
                  summary: Default ListGameServers 480 response
                  x-microcks-default: true
                  value: example-value
        '481':
          description: UnauthorizedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedException'
              examples:
                ListGameServers481Example:
                  summary: Default ListGameServers 481 response
                  x-microcks-default: true
                  value: example-value
        '482':
          description: InternalServiceException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServiceException'
              examples:
                ListGameServers482Example:
                  summary: Default ListGameServers 482 response
                  x-microcks-default: true
                  value: example-value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListGameServersInput'
      parameters:
      - name: Limit
        in: query
        schema:
          type: string
        description: Pagination limit
        required: false
      - name: NextToken
        in: query
        schema:
          type: string
        description: Pagination token
        required: false
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - GameLift.ListGameServers
      summary: Amazon GameLift List Game Servers
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=GameLift.ListGameServers'
components:
  schemas:
    NonZeroAndMaxString:
      type: string
      minLength: 1
      maxLength: 1024
    GameServerGroupNameOrArn:
      type: string
      pattern: '[a-zA-Z0-9-\.]+|^arn:.*:gameservergroup\/[a-zA-Z0-9-\.]+'
      minLength: 1
      maxLength: 256
    InternalServiceException: {}
    GameServerGroupArn:
      type: string
      pattern: ^arn:.*:gameservergroup\/[a-zA-Z0-9-\.]*
      minLength: 1
      maxLength: 256
    ListGameServersOutput:
      type: object
      properties:
        GameServers:
          allOf:
          - $ref: '#/components/schemas/GameServers'
          - description: A collection of game server objects that match the request.
        NextToken:
          allOf:
          - $ref: '#/components/schemas/NonZeroAndMaxString'
          - description: A token that indicates where to resume retrieving results on the next call to this operation. If no token is returned, these results represent the end of the list.
    GameServerId:
      type: string
      pattern: '[a-zA-Z0-9-\.]+'
      minLength: 3
      maxLength: 128
    GameServerGroupName:
      type: string
      pattern: '[a-zA-Z0-9-\.]+'
      minLength: 1
      maxLength: 128
    GameServerClaimStatus:
      type: string
      enum:
      - CLAIMED
    GameServerInstanceId:
      type: string
      pattern: ^i-[0-9a-zA-Z]{17}$
      minLength: 19
      maxLength: 19
    GameServer:
      type: object
      properties:
        GameServerGroupName:
          allOf:
          - $ref: '#/components/schemas/GameServerGroupName'
          - description: A unique identifier for the game server group where the game server is running.
        GameServerGroupArn:
          allOf:
          - $ref: '#/components/schemas/GameServerGroupArn'
          - description: The ARN identifier for the game server group where the game server is located.
        GameServerId:
          allOf:
          - $ref: '#/components/schemas/GameServerId'
          - description: A custom string that uniquely identifies the game server. Game server IDs are developer-defined and are unique across all game server groups in an Amazon Web Services account.
        InstanceId:
          allOf:
          - $ref: '#/components/schemas/GameServerInstanceId'
          - description: 'The unique identifier for the instance where the game server is running. This ID is available in the instance metadata. EC2 instance IDs use a 17-character format, for example: <code>i-1234567890abcdef0</code>.'
        ConnectionInfo:
          allOf:
          - $ref: '#/components/schemas/GameServerConnectionInfo'
          - description: The port and IP address that must be used to establish a client connection to the game server.
        GameServerData:
          allOf:
          - $ref: '#/components/schemas/GameServerData'
          - description: A set of custom game server properties, formatted as a single string value. This data is passed to a game client or service when it requests information on game servers.
        ClaimStatus:
          allOf:
          - $ref: '#/components/schemas/GameServerClaimStatus'
          - description: Indicates when an available game server has been reserved for gameplay but has not yet started hosting a game. Once it is claimed, the game server remains in <code>CLAIMED</code> status for a maximum of one minute. During this time, game clients connect to the game server to start the game and trigger the game server to update its utilization status. After one minute, the game server claim status reverts to null.
        UtilizationStatus:
          allOf:
          - $ref: '#/components/schemas/GameServerUtilizationStatus'
          - description: <p>Indicates whether the game server is currently available for new games or is busy. Possible statuses include:</p> <ul> <li> <p> <code>AVAILABLE</code> - The game server is available to be claimed. A game server that has been claimed remains in this status until it reports game hosting activity. </p> </li> <li> <p> <code>UTILIZED</code> - The game server is currently hosting a game session with players. </p> </li> </ul>
        RegistrationTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: Timestamp that indicates when the game server registered. The format is a number expressed in Unix time as milliseconds (for example <code>"1469498468.057"</code>).
        LastClaimTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: Timestamp that indicates the last time the game server was claimed. The format is a number expressed in Unix time as milliseconds (for example <code>"1469498468.057"</code>). This value is used to calculate when a claimed game server's status should revert to null.
        LastHealthCheckTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: Timestamp that indicates the last time the game server was updated with health status. The format is a number expressed in Unix time as milliseconds (for example <code>"1469498468.057"</code>). After game server registration, this property is only changed when a game server update specifies a health check value.
      description: <p> <b>This data type is used with the Amazon GameLift FleetIQ and game server groups.</b> </p> <p>Properties describing a game server that is running on an instance in a game server group. </p> <p>A game server is created by a successful call to <code>RegisterGameServer</code> and deleted by calling <code>DeregisterGameServer</code>. A game server is claimed to host a game session by calling <code>ClaimGameServer</code>. </p>
    InvalidRequestException: {}
    ListGameServersInput:
      type: object
      required:
      - GameServerGroupName
      title: ListGameServersInput
      properties:
        GameServerGroupName:
          allOf:
          - $ref: '#/components/schemas/GameServerGroupNameOrArn'
          - description: An identifier for the game server group to retrieve a list of game servers from. Use either the name or ARN value.
        SortOrder:
          allOf:
          - $ref: '#/components/schemas/SortOrder'
          - description: Indicates how to sort the returned data based on game server registration timestamp. Use <code>ASCENDING</code> to retrieve oldest game servers first, or use <code>DESCENDING</code> to retrieve newest game servers first. If this parameter is left empty, game servers are returned in no particular order.
        Limit:
          allOf:
          - $ref: '#/components/schemas/PositiveInteger'
          - description: The maximum number of results to return. Use this parameter with <code>NextToken</code> to get results as a set of sequential pages.
        NextToken:
          allOf:
          - $ref: '#/components/schemas/NonZeroAndMaxString'
          - description: A token that indicates the start of the next sequential page of results. Use the token that is returned with a previous call to this operation. To start at the beginning of the result set, do not specify a value.
    GameServerData:
      type: string
      pattern: .*\S.*
      minLength: 1
      maxLength: 1024
    UnauthorizedException: {}
    Timestamp:
      type: string
      format: date-time
    PositiveInteger:
      type: integer
      minimum: 1
    GameServerUtilizationStatus:
      type: string
      enum:
      - AVAILABLE
      - UTILIZED
    GameServers:
      type: array
      items:
        $ref: '#/components/schemas/GameServer'
    GameServerConnectionInfo:
      type: string
      pattern: .*\S.*
      minLength: 1
      maxLength: 512
    SortOrder:
      type: string
      enum:
      - ASCENDING
      - DESCENDING
  parameters:
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
