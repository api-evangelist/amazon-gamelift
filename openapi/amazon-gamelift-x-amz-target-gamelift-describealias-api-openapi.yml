paths:
  /#X-Amz-Target=GameLift.DescribeAlias:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: DescribeAlias
      description: <p>Retrieves properties for an alias. This operation returns all alias metadata and settings. To get an alias's target fleet ID only, use <code>ResolveAlias</code>. </p> <p>To get alias properties, specify the alias ID. If successful, the requested alias record is returned.</p> <p> <b>Related actions</b> </p> <p> <a href="https://docs.aws.amazon.com/gamelift/latest/developerguide/reference-awssdk.html#reference-awssdk-resources-fleets">All APIs by task</a> </p>
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescribeAliasOutput'
              examples:
                DescribeAlias200Example:
                  summary: Default DescribeAlias 200 response
                  x-microcks-default: true
                  value:
                    Alias: example-value
        '480':
          description: UnauthorizedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedException'
              examples:
                DescribeAlias480Example:
                  summary: Default DescribeAlias 480 response
                  x-microcks-default: true
                  value: example-value
        '481':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
              examples:
                DescribeAlias481Example:
                  summary: Default DescribeAlias 481 response
                  x-microcks-default: true
                  value: example-value
        '482':
          description: NotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundException'
              examples:
                DescribeAlias482Example:
                  summary: Default DescribeAlias 482 response
                  x-microcks-default: true
                  value: example-value
        '483':
          description: InternalServiceException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServiceException'
              examples:
                DescribeAlias483Example:
                  summary: Default DescribeAlias 483 response
                  x-microcks-default: true
                  value: example-value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescribeAliasInput'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - GameLift.DescribeAlias
      summary: Amazon GameLift Describe Alias
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=GameLift.DescribeAlias'
components:
  schemas:
    FleetId:
      type: string
      pattern: ^fleet-\S+
    InternalServiceException: {}
    FreeText:
      type: string
    DescribeAliasOutput:
      type: object
      properties:
        Alias:
          allOf:
          - $ref: '#/components/schemas/Alias'
          - description: The requested alias resource.
    Alias:
      type: object
      properties:
        AliasId:
          allOf:
          - $ref: '#/components/schemas/AliasId'
          - description: A unique identifier for the alias. Alias IDs are unique within a Region.
        Name:
          allOf:
          - $ref: '#/components/schemas/NonBlankAndLengthConstraintString'
          - description: A descriptive label that is associated with an alias. Alias names do not need to be unique.
        AliasArn:
          allOf:
          - $ref: '#/components/schemas/AliasArn'
          - description: The Amazon Resource Name (<a href="https://docs.aws.amazon.com/AmazonS3/latest/dev/s3-arn-format.html">ARN</a>) that is assigned to a Amazon GameLift alias resource and uniquely identifies it. ARNs are unique across all Regions. Format is <code>arn:aws:gamelift:&lt;region&gt;::alias/alias-a1234567-b8c9-0d1e-2fa3-b45c6d7e8912</code>. In a GameLift alias ARN, the resource ID matches the alias ID value.
        Description:
          allOf:
          - $ref: '#/components/schemas/FreeText'
          - description: A human-readable description of an alias.
        RoutingStrategy:
          allOf:
          - $ref: '#/components/schemas/RoutingStrategy'
          - description: 'The routing configuration, including routing type and fleet target, for the alias. '
        CreationTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: A time stamp indicating when this data object was created. Format is a number expressed in Unix time as milliseconds (for example <code>"1469498468.057"</code>).
        LastUpdatedTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: The time that this data object was last modified. Format is a number expressed in Unix time as milliseconds (for example <code>"1469498468.057"</code>).
      description: <p>Properties that describe an alias resource.</p> <p> <b>Related actions</b> </p> <p> <a href="https://docs.aws.amazon.com/gamelift/latest/developerguide/reference-awssdk.html#reference-awssdk-resources-fleets">All APIs by task</a> </p>
    AliasArn:
      type: string
      pattern: ^arn:.*:alias\/alias-\S+
    InvalidRequestException: {}
    AliasIdOrArn:
      type: string
      pattern: ^alias-\S+|^arn:.*:alias\/alias-\S+
    NotFoundException: {}
    AliasId:
      type: string
      pattern: ^alias-\S+
    DescribeAliasInput:
      type: object
      required:
      - AliasId
      title: DescribeAliasInput
      properties:
        AliasId:
          allOf:
          - $ref: '#/components/schemas/AliasIdOrArn'
          - description: 'The unique identifier for the fleet alias that you want to retrieve. You can use either the alias ID or ARN value. '
    UnauthorizedException: {}
    Timestamp:
      type: string
      format: date-time
    RoutingStrategy:
      type: object
      properties:
        Type:
          allOf:
          - $ref: '#/components/schemas/RoutingStrategyType'
          - description: <p>The type of routing strategy for the alias.</p> <p>Possible routing types include the following:</p> <ul> <li> <p> <b>SIMPLE</b> - The alias resolves to one specific fleet. Use this type when routing to active fleets.</p> </li> <li> <p> <b>TERMINAL</b> - The alias does not resolve to a fleet but instead can be used to display a message to the user. A terminal alias throws a TerminalRoutingStrategyException with the message embedded.</p> </li> </ul>
        FleetId:
          allOf:
          - $ref: '#/components/schemas/FleetId'
          - description: A unique identifier for the fleet that the alias points to. This value is the fleet ID, not the fleet ARN.
        Message:
          allOf:
          - $ref: '#/components/schemas/FreeText'
          - description: The message text to be used with a terminal routing strategy.
      description: <p>The routing configuration for a fleet alias.</p> <p> <b>Related actions</b> </p> <p> <a href="https://docs.aws.amazon.com/gamelift/latest/developerguide/reference-awssdk.html#reference-awssdk-resources-fleets">All APIs by task</a> </p>
    RoutingStrategyType:
      type: string
      enum:
      - SIMPLE
      - TERMINAL
    NonBlankAndLengthConstraintString:
      type: string
      pattern: .*\S.*
      minLength: 1
      maxLength: 1024
  parameters:
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
