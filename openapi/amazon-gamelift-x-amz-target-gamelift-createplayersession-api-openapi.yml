components:
  parameters:
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
  schemas:
    FleetId:
      type: string
      pattern: ^fleet-\S+
    CreatePlayerSessionInput:
      type: object
      required:
      - GameSessionId
      - PlayerId
      title: CreatePlayerSessionInput
      properties:
        GameSessionId:
          allOf:
          - $ref: '#/components/schemas/ArnStringModel'
          - description: A unique identifier for the game session to add a player to.
        PlayerId:
          allOf:
          - $ref: '#/components/schemas/NonZeroAndMaxString'
          - description: A unique identifier for a player. Player IDs are developer-defined.
        PlayerData:
          allOf:
          - $ref: '#/components/schemas/PlayerData'
          - description: Developer-defined information related to a player. Amazon GameLift does not use this data, so it can be formatted as needed for use in the game.
    InvalidRequestException: {}
    TerminalRoutingStrategyException: {}
    Timestamp:
      type: string
      format: date-time
    InvalidGameSessionStatusException: {}
    PlayerSessionId:
      type: string
      pattern: ^psess-\S+
    IpAddress:
      type: string
      pattern: ^[0-9A-Fa-f\:\.]+
      minLength: 1
      maxLength: 128
    UnauthorizedException: {}
    NotFoundException: {}
    CreatePlayerSessionOutput:
      type: object
      properties:
        PlayerSession:
          allOf:
          - $ref: '#/components/schemas/PlayerSession'
          - description: Object that describes the newly created player session record.
    NonZeroAndMaxString:
      type: string
      minLength: 1
      maxLength: 1024
    PlayerSession:
      type: object
      properties:
        PlayerSessionId:
          allOf:
          - $ref: '#/components/schemas/PlayerSessionId'
          - description: A unique identifier for a player session.
        PlayerId:
          allOf:
          - $ref: '#/components/schemas/NonZeroAndMaxString'
          - description: A unique identifier for a player that is associated with this player session.
        GameSessionId:
          allOf:
          - $ref: '#/components/schemas/NonZeroAndMaxString'
          - description: A unique identifier for the game session that the player session is connected to.
        FleetId:
          allOf:
          - $ref: '#/components/schemas/FleetId'
          - description: A unique identifier for the fleet that the player's game session is running on.
        FleetArn:
          allOf:
          - $ref: '#/components/schemas/FleetArn'
          - description: ' The Amazon Resource Name (<a href="https://docs.aws.amazon.com/AmazonS3/latest/dev/s3-arn-format.html">ARN</a>) associated with the GameLift fleet that the player''s game session is running on. '
        CreationTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: A time stamp indicating when this data object was created. Format is a number expressed in Unix time as milliseconds (for example <code>"1469498468.057"</code>).
        TerminationTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: A time stamp indicating when this data object was terminated. Format is a number expressed in Unix time as milliseconds (for example <code>"1469498468.057"</code>).
        Status:
          allOf:
          - $ref: '#/components/schemas/PlayerSessionStatus'
          - description: <p>Current status of the player session.</p> <p>Possible player session statuses include the following:</p> <ul> <li> <p> <b>RESERVED</b> -- The player session request has been received, but the player has not yet connected to the server process and/or been validated. </p> </li> <li> <p> <b>ACTIVE</b> -- The player has been validated by the server process and is currently connected.</p> </li> <li> <p> <b>COMPLETED</b> -- The player connection has been dropped.</p> </li> <li> <p> <b>TIMEDOUT</b> -- A player session request was received, but the player did not connect and/or was not validated within the timeout limit (60 seconds).</p> </li> </ul>
        IpAddress:
          allOf:
          - $ref: '#/components/schemas/IpAddress'
          - description: The IP address of the game session. To connect to a Amazon GameLift game server, an app needs both the IP address and port number.
        DnsName:
          allOf:
          - $ref: '#/components/schemas/DnsName'
          - description: '<p>The DNS identifier assigned to the instance that is running the game session. Values have the following format:</p> <ul> <li> <p>TLS-enabled fleets: <code>&lt;unique identifier&gt;.&lt;region identifier&gt;.amazongamelift.com</code>.</p> </li> <li> <p>Non-TLS-enabled fleets: <code>ec2-&lt;unique identifier&gt;.compute.amazonaws.com</code>. (See <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-instance-addressing.html#concepts-public-addresses">Amazon EC2 Instance IP Addressing</a>.)</p> </li> </ul> <p>When connecting to a game session that is running on a TLS-enabled fleet, you must use the DNS name, not the IP address.</p>'
        Port:
          allOf:
          - $ref: '#/components/schemas/PortNumber'
          - description: Port number for the game session. To connect to a Amazon GameLift server process, an app needs both the IP address and port number.
        PlayerData:
          allOf:
          - $ref: '#/components/schemas/PlayerData'
          - description: 'Developer-defined information related to a player. Amazon GameLift does not use this data, so it can be formatted as needed for use in the game. '
      description: <p>Represents a player session. Player sessions are created either for a specific game session, or as part of a game session placement or matchmaking request. A player session can represents a reserved player slot in a game session (when status is <code>RESERVED</code>) or actual player activity in a game session (when status is <code>ACTIVE</code>). A player session object, including player data, is automatically passed to a game session when the player connects to the game session and is validated. After the game session ends, player sessions information is retained for 30 days and then removed.</p> <p> <b>Related actions</b> </p> <p> <a href="https://docs.aws.amazon.com/gamelift/latest/developerguide/reference-awssdk.html#reference-awssdk-resources-fleets">All APIs by task</a> </p>
    PlayerSessionStatus:
      type: string
      enum:
      - RESERVED
      - ACTIVE
      - COMPLETED
      - TIMEDOUT
    DnsName:
      type: string
    InternalServiceException: {}
    PlayerData:
      type: string
      minLength: 1
      maxLength: 2048
    GameSessionFullException: {}
    PortNumber:
      type: integer
      minimum: 1
      maximum: 60000
    ArnStringModel:
      type: string
      pattern: '[a-zA-Z0-9:/-]+'
      minLength: 1
      maxLength: 256
    FleetArn:
      type: string
      pattern: ^arn:.*:fleet\/fleet-\S+
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
