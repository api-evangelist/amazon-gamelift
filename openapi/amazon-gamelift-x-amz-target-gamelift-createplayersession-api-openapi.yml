          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlayerSessionInput'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - GameLift.CreatePlayerSession
      summary: Amazon GameLift Create Player Session
