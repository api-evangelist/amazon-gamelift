tags:
- name: '#X Amz Target=GameLift.CreatePlayerSession'
paths:
  /#X-Amz-Target=GameLift.CreatePlayerSession:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: CreatePlayerSession
      description: 'Reserves an open player slot in a game session for a player. New player sessions can be created in any game session with an open slot that is in ACTIVE status and has a player creation policy of ACCEPT_ALL. You can add a group of players to a game session with CreatePlayerSessions .


        To create a player session, specify a game session ID, player ID, and optionally a set of player data.


        If successful, a slot is reserved in the game session for the player and a new PlayerSessions object is returned with a player session ID. The player references the player session ID when sending a connection request to the game session, and the game server can use it to validate the player reservation with the Amazon GameLift service. Player sessions cannot be updated.


        The maximum number of players per game session is 200. It is not adjustable.


        Related actions


        All APIs by task'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePlayerSessionOutput'
              examples:
                CreatePlayerSession200Example:
                  summary: Default CreatePlayerSession 200 response
                  x-microcks-default: true
                  value:
                    PlayerSession: example-value
        '480':
          description: InternalServiceException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServiceException'
              examples:
                CreatePlayerSession480Example:
                  summary: Default CreatePlayerSession 480 response
                  x-microcks-default: true
                  value: example-value
        '481':
          description: UnauthorizedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedException'
              examples:
                CreatePlayerSession481Example:
                  summary: Default CreatePlayerSession 481 response
                  x-microcks-default: true
                  value: example-value
        '482':
          description: InvalidGameSessionStatusException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidGameSessionStatusException'
              examples:
                CreatePlayerSession482Example:
                  summary: Default CreatePlayerSession 482 response
                  x-microcks-default: true
                  value: example-value
        '483':
          description: GameSessionFullException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameSessionFullException'
              examples:
                CreatePlayerSession483Example:
                  summary: Default CreatePlayerSession 483 response
                  x-microcks-default: true
                  value: example-value
        '484':
          description: TerminalRoutingStrategyException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalRoutingStrategyException'
              examples:
                CreatePlayerSession484Example:
                  summary: Default CreatePlayerSession 484 response
                  x-microcks-default: true
                  value: example-value
        '485':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
              examples:
                CreatePlayerSession485Example:
                  summary: Default CreatePlayerSession 485 response
                  x-microcks-default: true
                  value: example-value
        '486':
          description: NotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundException'
              examples:
                CreatePlayerSession486Example:
                  summary: Default CreatePlayerSession 486 response
                  x-microcks-default: true
                  value: example-value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlayerSessionInput'
      parameters:
      - name: X-Amz-Target
        in: header
